<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm Notch · NOMI 风多模块刘海中枢(全交互)</title>
<!--
  HELM NOTCH — NOMI 风 redesign v2(2026-07-06,功能对齐现行 helm-notch-pro.html)
  风格:用户拍板的 NOMI 白面板(白卡·大圆角·柔和阴影·黑胶囊·橙紫渐变·娃娃脸 logo)。
  功能全量(对齐 ORAGE 现行稿 8 模块,一个不少):
   1 总览 Dashboard(不对称 bento:大媒体卡+日历+agent+速记快捷条)
   2 媒体(封面+歌词滚动高亮+可点进度 seek+控制)
   3 速记(5 kind+任务给自己/交给agent 双轨+最近记录列表含链接解析卡)
   4 日历(周条+今日事件+加事件)
   5 文件 Shelf(拖拽暂存→上传记录/关联驾驶舱/移除)
   6 智能体(会话列表+权限横幅 diff+Allow/Deny+选择题横幅)
   7 剪贴板(历史:重新复制/存速记)
   8 专注(番茄钟:渐变圆环+开始/暂停/重置+关联任务)
  外加:折叠态(左封面缩影+均衡器,右状态)/权限 banner 态演示/Esc 收起/
  拖文件悬停→壳长出 drop 承接面(松手暂存,2026-07-07 用户拍板新增)。
  进 Swift 时以本文件 + DESIGN.md 为准:不改本文件、改代码。
-->
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ink:#111114; --ink2:#5c5c66; --ink3:#a2a2ab;
    --logo:#271C11;
    --hair:#ececef; --pill:#f1f1f3;
    --g1:#ff8a3d; --g2:#a855f7;
    --ok:#28a745; --warn:#ff9500; --bad:#e5484d;
    --shadow:0 1px 2px rgba(17,17,20,.05),0 6px 18px rgba(17,17,20,.07);
    --shadow-xl:0 8px 24px rgba(17,17,20,.14),0 32px 80px rgba(17,17,20,.22);
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg,#e8e6f2 0%,#f3ece2 45%,#e4eef0 100%)}

  /* ── 菜单栏 + 刘海 ─────────────── */
  .menubar{position:relative;height:34px;background:#0a0a0c;display:flex;align-items:center;
    padding:0 16px;color:rgba(255,255,255,.85);font-size:12.5px;gap:18px;user-select:none}
  .menubar .r{margin-left:auto;display:flex;gap:14px;color:rgba(255,255,255,.6);font-size:11.5px}
  /* shell=单体生长(参考 notch-pro):折叠=黑条本身;展开=同一元素变宽+向下长,
     黑条变成常驻摄像头凹槽,内容从凹槽下方开始(避开摄像头) */
  .shell{position:absolute;top:0;left:50%;transform:translateX(-50%);width:310px;z-index:70;
    background:#fff;border-radius:0 0 14px 14px;overflow:hidden;cursor:pointer;color:var(--ink);
    transition:width .46s var(--ease),border-radius .4s var(--ease),box-shadow .4s var(--ease)}
  .shell.open{width:440px;border-radius:0 0 26px 26px;box-shadow:var(--shadow-xl);cursor:default}
  .toprow{display:flex;align-items:stretch;height:34px}
  .tl,.tr{flex:1;display:flex;align-items:center;gap:5px;padding:0 10px;opacity:0;
    pointer-events:none;transition:opacity .25s .16s linear;white-space:nowrap}
  /* 折叠时左右翼零占位,免得把 310px 条挤溢出 */
  .shell:not(.open) .tl,.shell:not(.open) .tr{flex:0 0 0;padding:0;overflow:hidden}
  .tr{justify-content:flex-end}
  .shell.open .tl,.shell.open .tr{opacity:1;pointer-events:auto}
  .tl .lg{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink)}
  .tl .lg svg{color:var(--logo)}
  .shell.dark .tl .lg svg{color:var(--ink)}
  .tr .wx{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink3)}
  .tr .wx svg{width:13px;height:13px}
  .tr .gear{width:24px;height:24px;flex:none;border-radius:50%;background:transparent;border:none;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tr .gear:hover{color:var(--ink);background:var(--pill)}
  .tr .gear svg{width:14px;height:14px}
  .hw{width:310px;height:34px;flex:none;background:#000;border-radius:0 0 14px 14px;
    display:flex;align-items:center;padding:0 14px;gap:9px;position:relative}
  /* 折叠布局(参考 pro):左组(logo/封面/波形) — 中央空档(摄像头) — 右组(live) */
  .hw .fold .sp{min-width:84px}
  .hw .fold{display:flex;align-items:center;gap:9px;flex:1;transition:opacity .2s linear}
  .shell.open .hw .fold{opacity:0}
  .hw .cam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;
    border-radius:50%;background:#17171b;box-shadow:inset 0 0 2px #000,0 0 0 2.5px #0a0a0c}
  .hw svg.logo{color:#fff;opacity:.92;flex:none}
  .hw .minicover{width:18px;height:18px;border-radius:5px;flex:none;
    background:linear-gradient(135deg,#3a2f18,#1c1c22);display:flex;align-items:center;justify-content:center}
  .hw .minicover svg{width:9px;height:9px;color:rgba(255,255,255,.8)}
  .hw .wave{display:flex;align-items:flex-end;gap:2px;height:12px;flex:none}
  .hw .wave i{width:2.5px;border-radius:2px;background:linear-gradient(180deg,var(--g1),var(--g2));animation:wv 1s var(--ease) infinite alternate}
  .hw .wave i:nth-child(1){height:5px}
  .hw .wave i:nth-child(2){height:10px;animation-delay:.15s}
  .hw .wave i:nth-child(3){height:7px;animation-delay:.3s}
  .hw .wave i:nth-child(4){height:11px;animation-delay:.45s}
  @keyframes wv{to{transform:scaleY(.45)}}
  .hw .sp{flex:1}
  .hw .stat{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.75)}
  .hw .stat .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .shell.dragover{outline:2px dashed var(--g1);outline-offset:-5px}
  /* 拖文件悬停 → 壳像 hover 一样长出 drop 承接面(2026-07-07 用户拍板新增) */
  #dropwrap{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s .12s linear;display:none;padding:14px 16px 16px}
  .shell.dropmode #dropwrap{display:block}
  .shell.dropmode #pwrap,.shell.dropmode #bwrap{display:none}
  .shell.open #dropwrap{opacity:1}
  .droptarget{border:2px dashed #3a3a40;border-radius:18px;padding:26px 16px;text-align:center;
    transition:all .18s var(--ease)}
  .shell:not(.dark) .droptarget{border-color:#d8d8de}
  .droptarget .dic{width:40px;height:40px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
  .droptarget .dic svg{width:18px;height:18px}
  .droptarget .t1{font-size:13px;font-weight:700;color:var(--ink)}
  .droptarget .t2{font-size:10.5px;color:var(--ink3);margin-top:3px}
  .droptarget.hot{border-color:var(--g1);background:rgba(255,138,61,.07)}

  /* ── 主面板 ─────────────── */
  .grow{display:grid;grid-template-rows:0fr;transition:grid-template-rows .46s var(--ease)}
  .shell.open .grow{grid-template-rows:1fr}
  #pwrap{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s .12s linear}
  .shell.open #pwrap{opacity:1}
  .okdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  .mtabs{display:flex;justify-content:center;gap:14px;padding:4px 0 14px}
  .mtab{width:40px;height:40px;border-radius:50%;border:2px solid transparent;background:var(--pill);
    color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .18s var(--ease)}
  .mtab svg{width:17px;height:17px}
  .mtab:hover{color:var(--ink)}
  .mtab.on{color:var(--ink);
    background:linear-gradient(var(--pill),var(--pill)) padding-box,
               linear-gradient(135deg,var(--g1),var(--g2)) border-box}
  .pbody{padding:8px 18px 4px}
  .pbody.slide-l{animation:sl .3s var(--ease)}
  .pbody.slide-r{animation:sr .3s var(--ease)}
  @keyframes sl{from{opacity:.2;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes sr{from{opacity:.2;transform:translateX(-26px)}to{opacity:1;transform:none}}
  .open-helm{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
    background:var(--pill);border:none;border-radius:50%;cursor:pointer;color:var(--ink)}
  .open-helm:hover{background:#e8e8ec;color:var(--ink)}
  .open-helm svg{color:var(--logo)}

  /* 通用 */
  .wcard{background:var(--cardbg,#fff);border-radius:14px;box-shadow:var(--shadow);transition:box-shadow .18s var(--ease)}
  .wcard:hover{box-shadow:0 2px 6px rgba(17,17,20,.06),0 12px 28px rgba(17,17,20,.12)}
  .gbtn{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;border:none;border-radius:999px;
    padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer}
  .kbtn{background:var(--ink);color:var(--onink,#fff);border:none;border-radius:999px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
  .pbtn{font-size:10.5px;background:var(--pill);border:none;border-radius:999px;padding:5px 11px;color:var(--ink2);cursor:pointer}
  .pbtn:hover{background:#e8e8ec;color:var(--ink)}
  .spark{width:12px;height:12px;border-radius:50%;background:conic-gradient(from 210deg,var(--g1),var(--g2),var(--g1));display:inline-block;flex:none}

  /* 1 总览 bento */
  .bento{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:auto auto;gap:10px}
  .b-media{grid-row:1/3;display:flex;flex-direction:column;justify-content:flex-end;min-height:128px;cursor:pointer;
    border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,#26202c,#191a20)}
  .b-media .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .b-media .art svg{width:34px;height:34px;color:rgba(255,255,255,.35)}
  .b-media .meta{position:relative;padding:12px 14px;background:linear-gradient(transparent,rgba(10,10,12,.82))}
  .b-media .t{color:#fff;font-size:13.5px;font-weight:700}
  .b-media .a{color:rgba(255,255,255,.65);font-size:10.5px;margin-top:1px}
  .b-media .eq{position:absolute;right:12px;bottom:14px;display:flex;gap:2px;align-items:flex-end;height:12px}
  .b-media .eq i{width:2.5px;border-radius:2px;background:linear-gradient(180deg,var(--g1),var(--g2));animation:wv 1s var(--ease) infinite alternate}
  .b-media .eq i:nth-child(2){animation-delay:.2s}.b-media .eq i:nth-child(3){animation-delay:.35s}
  .bcard{padding:11px 13px;cursor:pointer}
  .bcard .lb{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink3);letter-spacing:.3px}
  .bcard .v{font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.35}
  .bcard .s{font-size:10.5px;color:var(--ink3);margin-top:2px}
  .quickcap{grid-column:1/3;display:flex;gap:8px;background:var(--pill);border-radius:999px;padding:5px 5px 5px 15px;align-items:center}
  .quickcap input{flex:1;border:none;outline:none;background:transparent;font-family:var(--sans);font-size:12.5px;color:var(--ink)}
  .quickcap input::placeholder{color:var(--ink3)}

  /* 2 媒体 */
  .media{display:flex;gap:13px;align-items:center}
  .cover{width:76px;height:76px;border-radius:16px;flex:none;background:linear-gradient(135deg,#1c1c22,#3a2f18);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .cover svg{width:24px;height:24px;color:rgba(255,255,255,.85)}
  .minfo{min-width:0;flex:1}
  .minfo .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .minfo .a{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .mprog{height:6px;border-radius:99px;background:var(--pill);margin-top:10px;overflow:hidden;cursor:pointer}
  .mprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .2s linear}
  .mtimes{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:4px}
  .mctl{display:flex;align-items:center;justify-content:flex-start;gap:12px;margin-top:12px}
  .mbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--pill);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mbtn:hover{background:#e8e8ec}
  .mbtn.play{width:44px;height:44px;background:var(--ink);color:var(--onink,#fff)}
  .mbtn svg{width:15px;height:15px}
  .media2{display:flex;gap:18px;align-items:stretch}
  .mleft{width:196px;flex:none}
  .mlyr{flex:1;height:196px;overflow:hidden;position:relative;
    -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);
    mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
  .mlyr .roll{display:flex;flex-direction:column;gap:12px;transition:transform .55s var(--ease)}
  .lyr{font-size:14.5px;font-weight:600;color:var(--ink3);line-height:1.45;transition:color .4s,font-size .4s}
  .lyr.on{color:var(--ink);font-size:16.5px;font-weight:800}

  /* 3 速记 */
  .kindrow{display:flex;gap:5px;margin-bottom:9px}
  .kind{font-size:11.5px;color:var(--ink2);background:var(--pill);border:none;border-radius:999px;padding:6px 12px;cursor:pointer}
  .kind.on{background:var(--ink);color:var(--onink,#fff);font-weight:600}
  .whobar{display:none;gap:5px;margin-bottom:9px}
  .whobar.show{display:flex}
  .who{font-size:11px;color:var(--ink2);background:#fff;border:1px solid var(--hair);border-radius:999px;padding:5px 12px;cursor:pointer}
  .who.on{border-color:transparent;background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;font-weight:600}
  .capbox{background:var(--pill);border-radius:16px;padding:11px 13px}
  .capbox textarea{width:100%;border:none;outline:none;background:transparent;resize:none;
    font-family:var(--sans);font-size:13px;color:var(--ink);min-height:36px;line-height:1.5}
  .capbox textarea::placeholder{color:var(--ink3)}
  .caprow{display:flex;align-items:center;margin-top:6px}
  .caprow .hint{font-size:10.5px;color:var(--ink3)}
  .caprow .send{margin-left:auto}
  .recent{margin-top:10px}
  .rlab{font-size:10px;color:var(--ink3);letter-spacing:.4px;margin:0 2px 6px}
  .ritem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:12px}
  .ritem:hover{background:var(--pill)}
  .ritem .ic{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8.5px;font-weight:800}
  .ritem .tx{flex:1;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ritem .tx b{color:var(--ink);font-weight:600}
  .ritem .tm{font-family:var(--mono);font-size:9px;color:var(--ink3)}
  .askout{display:none;margin-top:9px;border-radius:14px;padding:11px 13px;font-size:12px;line-height:1.55;color:var(--ink2);background:#fff;box-shadow:var(--shadow)}
  .askout.show{display:block}
  .askout{background:var(--cardbg,#fff)}
  .askout .who2{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-bottom:4px}

  /* 4 日历 */
  .weekbar{display:flex;gap:5px;margin-bottom:11px}
  .wd{flex:1;text-align:center;padding:7px 0 8px;border-radius:12px;cursor:pointer}
  .wd:hover{background:var(--pill)}
  .wd .w{font-size:9px;color:var(--ink3)}
  .wd .d{font-size:12.5px;font-weight:600;margin-top:2px}
  .wd.today{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
  .wd.today .w{color:rgba(255,255,255,.8)}
  .evrow{display:flex;gap:11px;padding:8px 2px;align-items:flex-start}
  .evrow+.evrow{border-top:1px solid var(--hair)}
  .evrow .when{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:40px;flex:none;padding-top:2px}
  .evrow .bar{width:3px;border-radius:2px;align-self:stretch;flex:none}
  .evrow .t{font-size:12.5px;font-weight:600}
  .evrow .s{font-size:10.5px;color:var(--ink3);margin-top:1px}
  .addev{display:flex;gap:8px;margin-top:10px;background:var(--pill);border-radius:999px;padding:5px 5px 5px 15px;align-items:center}
  .addev input{flex:1;border:none;outline:none;background:transparent;font-size:12px;font-family:var(--sans);color:var(--ink)}

  /* 5 文件 shelf */
  .dropzone{border:1.6px dashed #d8d8de;border-radius:16px;padding:16px;text-align:center;color:var(--ink3);
    font-size:11.5px;line-height:1.6;transition:all .18s var(--ease)}
  .dropzone.hot{border-color:var(--g1);color:var(--g1);background:#fff8f2}
  .dropzone b{color:var(--ink2)}
  .shelf{margin-top:10px;display:flex;flex-direction:column;gap:7px}
  .file{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .file .fic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800}
  .file .fnm{flex:1;min-width:0}
  .file .fnm .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file .fnm .s{font-size:10px;color:var(--ink3)}
  .file .acts{display:flex;gap:5px}

  /* 6 智能体(三子页横滑:会话/端口/PR) */
  .swiperow{position:relative}
  .swipe{height:296px;overflow-y:auto;scroll-snap-type:y mandatory;
    scrollbar-width:none;margin:0 -2px;padding:0 2px}
  .swipe::-webkit-scrollbar{display:none}
  .spage{height:100%;scroll-snap-align:start;overflow:hidden}
  .sdots{position:absolute;right:3px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:5px}
  .sdot{width:5px;height:5px;border-radius:50%;background:var(--hair);transition:all .2s;cursor:pointer}
  .sdot.on{background:linear-gradient(180deg,var(--g1),var(--g2));height:14px;border-radius:99px}
  .subh{display:flex;align-items:baseline;gap:7px;font-size:10px;color:var(--ink3);letter-spacing:.4px;margin:0 2px 7px}
  .subh b{color:var(--ink2);font-weight:600;font-size:11px}
  .portrow{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:7px}
  .portrow .pd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
  .portrow .pnum{font-family:var(--mono);font-size:11.5px;font-weight:700;min-width:44px}
  .portrow .pname{flex:1;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prrow{padding:10px 12px;margin-bottom:7px}
  .prrow .h{display:flex;align-items:center;gap:8px}
  .prrow .src{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--onink,#fff);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none}
  .prrow .t{font-size:12px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prrow .chip{font-size:9.5px;border-radius:999px;padding:3px 8px;flex:none}
  .chip.ok{background:#e9f8ee;color:#177a36}
  .chip.warn{background:#fff4e8;color:#c05e00}
  .shell.dark .chip.ok{background:#1e3a26;color:#7fe0a0}
  .shell.dark .chip.warn{background:#3a2c1e;color:#ffc58a}
  .prrow .sub{font-size:10.5px;color:var(--ink3);margin-top:4px}
  .sess{padding:10px 13px;margin-bottom:8px;cursor:pointer}
  .sess .hd{display:flex;align-items:center;gap:8px}
  .sess .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .d-live{background:var(--ok);box-shadow:0 0 0 3px #e9f8ee}
  .d-wait{background:var(--g1);box-shadow:0 0 0 3px #fff2e6}
  .d-idle{background:var(--ink3);box-shadow:0 0 0 3px var(--pill)}
  .sess .nm{font-size:12.5px;font-weight:600}
  .sess .r{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
  .sess .ln{font-size:11px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .permcard{border-radius:14px;padding:11px 13px;margin-bottom:8px;background:#fff;box-shadow:var(--shadow);border-left:3px solid var(--warn)}
  .permcard .ph{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink2)}
  .permcard .ph b{color:var(--ink)}
  .permcard{background:var(--cardbg,#fff)}
  .diff{margin:8px 0;border-radius:10px;overflow:hidden;font-family:var(--mono);font-size:10px;line-height:1.7}
  .diff .dl{padding:2px 10px}
  .diff .rm{background:#fdecec;color:#b3261e}
  .diff .ad{background:#e9f8ee;color:#177a36}
  .permacts{display:flex;gap:6px}
  .qbtns{display:flex;gap:5px;margin-top:7px}
  .qb{font-size:10.5px;background:var(--pill);border:none;border-radius:999px;padding:5px 11px;color:var(--ink2);cursor:pointer}
  .qb:hover{background:#e8e8ec;color:var(--ink)}
  .qb.pri{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;font-weight:600}

  /* 7 剪贴板 */
  .clip{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:7px}
  .clip .cic{width:26px;height:26px;border-radius:8px;flex:none;background:var(--pill);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .clip .cic svg{width:13px;height:13px}
  .clip .tx{flex:1;min-width:0;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip .tx b{color:var(--ink);font-weight:600}

  /* 8 专注 */
  .focus{display:flex;gap:16px;align-items:center;padding:4px 2px}
  .ring{width:104px;height:104px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
  .ring .inner{width:86px;height:86px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .ring .tt{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.5px}
  .ring .ss{font-size:9px;color:var(--ink3);margin-top:1px}
  .fright{flex:1}
  .fright .lb{font-size:10px;color:var(--ink3);letter-spacing:.4px}
  .fright .task{font-size:12.5px;font-weight:600;margin:4px 0 10px}
  .facts{display:flex;gap:6px}

  /* banner 态(单体):整个 notch 变成横幅——shell 复用生长,只是内容换成 #bwrap */
  #bwrap{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s .12s linear;display:none;padding:12px 16px 14px}
  .shell.bannermode #bwrap{display:block}
  .shell.bannermode #pwrap{display:none}
  .shell.open #bwrap{opacity:1}
  .shell.bannermode.open{width:460px}

  /* 深色面板版本(用户拍板要黑色背景版):变量整体反转,shell.dark 作用域 */
  .shell.dark{--ink:#f2f2f4;--ink2:#c2c2ca;--ink3:#84848e;--pill:#232327;--hair:#2a2a2e;
    --cardbg:#1d1d21;--onink:#111114;background:#0f0f11}
  .shell.dark.open .hw{background:transparent}
  .shell.dark .dropzone{border-color:#3a3a40}
  .shell.dark .dropzone.hot{background:#241c14}
  .shell.dark .diff .rm{background:#3a1e1e;color:#ff9e9e}
  .shell.dark .diff .ad{background:#1e3a26;color:#7fe0a0}
  .shell.dark .askout,.shell.dark .permcard{box-shadow:none;border:1px solid var(--hair)}
  .shell.dark .term{border:1px solid #2a2a2e}

  .deskhint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:12px;color:rgba(17,17,20,.45);background:rgba(255,255,255,.6);backdrop-filter:blur(8px);
    border-radius:999px;padding:9px 18px;box-shadow:var(--shadow)}
  .deskhint button{margin-left:10px;font-size:11px;border:none;border-radius:999px;padding:5px 12px;background:#fff;color:var(--ink2);cursor:pointer;box-shadow:var(--shadow)}
</style>

<script>
const $=s=>document.querySelector(s);
let open=true, tab='dash', kind='note', who='me', playing=true, asked=false, recentOpen=false;
let pos=112, dur=245; // 秒
let focusLeft=25*60, focusRun=false, focusTotal=25*60;

const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const PREV='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-10 6 10 6z"/></svg>';
const NEXT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>';
const NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>';
const LINK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07L11 5"/><path d="M14 11a5 5 0 00-7.07 0L4.1 13.83a5 5 0 007.07 7.07L13 19"/></svg>';
const TXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
const IMG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 8"/></svg>';

const KINDS=[['note','速记'],['journal','日记'],['task','任务'],['focus','专注'],['ask','问大脑']];
const PH={note:'随手记一笔 — 链接会自动解析…',journal:'今天怎么样?写两句…',task:'要做什么?(时间地点 AI 来读)',focus:'这段时间专注做什么…',ask:'问 Helm 大脑一个问题…'};
const LYRICS=['gravity is working against me','and gravity wants to bring me down',
 'oh I will fight it, I will fight it','oh twice as much ain\'t twice as good',
 'and can\'t sustain like one half could','it wants my soul, it wants my whole life',
 'just keep me where the light is','oh keep me where the light is'];
let lyrIdx=2;

const FILES=[]; // shelf
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ── 渲染 ── */
function renderBody(){
  const b=$('#pbody');
  if(tab==='dash'){
    b.innerHTML=`
    <div class="bento">
      <div class="b-media" id="bMedia">
        <div class="art">${NOTE}</div>
        <div class="eq"><i style="height:5px"></i><i style="height:10px"></i><i style="height:7px"></i></div>
        <div class="meta"><div class="t">Gravity</div><div class="a">John Mayer — Continuum</div></div>
      </div>
      <div class="wcard bcard" id="bCal"><div class="lb"><span class="spark"></span>日历 · 下一项</div>
        <div class="v">10:00 站会</div><div class="s">还有 42 分钟 · 之后 15:00 1:1</div></div>
      <div class="wcard bcard" id="bAgent"><div class="lb"><span class="okdot"></span>智能体</div>
        <div class="v">claude · ~/helm</div><div class="s">✓ 214 tests — snapshot 中 · tok 14.2k</div></div>
      <div class="quickcap">
        <input id="qc" placeholder="速记一笔 — ⏎ 发送,链接自动解析…">
        <button class="gbtn" onclick="qcSend()">发送</button>
      </div>
    </div>`;
    $('#bMedia').onclick=()=>switchTab('media');
    $('#bCal').onclick=()=>switchTab('cal');
    $('#bAgent').onclick=()=>switchTab('agents');
    $('#qc').addEventListener('keydown',e=>{if(e.key==='Enter')qcSend()});
  }
  else if(tab==='media'){
    b.innerHTML=`
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:9px">
        <button class="pbtn" id="backDash">‹ 总览</button>
        <span style="font-size:10px;color:var(--ink3)">媒体</span></div>
      <div class="media2">
        <div class="mleft">
          <div class="cover" style="width:88px;height:88px">${NOTE}</div>
          <div class="t" style="font-size:14.5px;font-weight:700;margin-top:10px">Gravity</div>
          <div class="a" style="font-size:11px;color:var(--ink3);margin-top:2px">John Mayer — Continuum</div>
          <div class="mprog" id="prog"><i id="pg" style="width:${pos/dur*100}%"></i></div>
          <div class="mtimes"><span id="tA">${fmt(pos)}</span><span>${fmt(dur)}</span></div>
          <div class="mctl">
            <button class="mbtn">${PREV}</button>
            <button class="mbtn play" id="pp">${playing?PAUSE:PLAY}</button>
            <button class="mbtn">${NEXT}</button>
          </div>
        </div>
        <div class="mlyr"><div class="roll" id="roll">${LYRICS.map((l,i)=>`<div class="lyr${i===lyrIdx?' on':''}">${l}</div>`).join('')}</div></div>
      </div>`;
    $('#pp').onclick=()=>{playing=!playing;renderBody()};
    $('#backDash').onclick=()=>switchTab('dash');
    $('#prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();pos=Math.round((e.clientX-r.left)/r.width*dur);renderBody()};
    scrollLyr();
  }
  else if(tab==='capture'){
    b.innerHTML=`
      <div class="kindrow">${KINDS.map(([k,n])=>`<button class="kind${k===kind?' on':''}" data-k="${k}">${n}</button>`).join('')}</div>
      <div class="whobar${kind==='task'?' show':''}">
        <button class="who${who==='me'?' on':''}" data-w="me">给自己 · 待办</button>
        <button class="who${who==='agent'?' on':''}" data-w="agent">交给 agent · 定时</button>
      </div>
      ${kind==='focus'?focusHTML():`<div class="capbox">
        <textarea id="cap" placeholder="${PH[kind]}"></textarea>
        <div class="caprow"><span class="hint">${kind==='ask'?'⏎ 提问 · 走全局 provider':'⏎ 发送 · AI 自动整理'}</span>
          <button class="gbtn send" id="capSend">${kind==='ask'?'提问':'发送'}</button></div>
      </div>`}
      <div class="askout${asked?' show':''}">
        <div class="who2"><span class="spark"></span>Helm 大脑</div>
        速记里的链接会自动解析:YouTube 走 oEmbed,论文走 arXiv,网页抓 OpenGraph,AI 再补摘要和标签。
      </div>
      <div class="recent">
        <button class="rlab" id="rToggle" style="display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:2px;color:var(--ink3);font-size:10px;letter-spacing:.4px">
          <span style="display:inline-block;transition:transform .2s;transform:rotate(${recentOpen?90:0}deg)">▸</span>最近 · 3 条</button>
        ${recentOpen?`
        <div class="ritem"><span class="ic" style="background:#ff2d2d">YT</span>
          <span class="tx"><b>PSY - GANGNAM STYLE M/V</b> · 已解析:封面+摘要+标签</span><span class="tm">10:08</span></div>
        <div class="ritem"><span class="ic" style="background:#8b5a2b">AX</span>
          <span class="tx"><b>Attention Is All You Need</b> · arXiv 摘要已抓</span><span class="tm">11:58</span></div>
        <div class="ritem"><span class="ic" style="background:#111114">N</span>
          <span class="tx">驾驶舱 e2e 三个坑——写进 backlog 复盘。</span><span class="tm">14:31</span></div>`:''}
      </div>`;
    b.querySelectorAll('.kind').forEach(k=>k.onclick=()=>{kind=k.dataset.k;asked=false;renderBody()});
    b.querySelectorAll('.who').forEach(w=>w.onclick=()=>{who=w.dataset.w;renderBody()});
    $('#rToggle').onclick=()=>{recentOpen=!recentOpen;renderBody()};
    if(kind==='focus'){bindFocus();}
    else $('#capSend').onclick=()=>{
      const c=$('#cap'); if(!c.value.trim())return;
      if(kind==='ask'){asked=true;renderBody();}
      else{c.value='';c.placeholder='已发送 — AI 解析中…';setTimeout(()=>{c.placeholder=PH[kind]},1500);}
    };
  }
  else if(tab==='cal'){
    const days=[['一',6,true],['二',7],['三',8],['四',9],['五',10],['六',11],['日',12]];
    b.innerHTML=`
      <div class="weekbar">${days.map(([w,d,t])=>`<div class="wd${t?' today':''}"><div class="w">周${w}</div><div class="d">${d}</div></div>`).join('')}</div>
      <div class="evrow"><span class="when">10:00</span><span class="bar" style="background:linear-gradient(180deg,var(--g1),var(--g2))"></span>
        <div><div class="t">站会</div><div class="s">30 分钟 · 还有 42 分钟</div></div></div>
      <div class="evrow"><span class="when">15:00</span><span class="bar" style="background:linear-gradient(180deg,var(--g1),var(--g2))"></span>
        <div><div class="t">1:1 · design review</div><div class="s">45 分钟</div></div></div>
      <div class="evrow"><span class="when">18:00</span><span class="bar" style="background:var(--ok)"></span>
        <div><div class="t">夜巡 · swift test</div><div class="s">agent 定时任务</div></div></div>
      <div class="addev"><input id="evIn" placeholder="加事件:明天 3pm 和 Sam 过设计…(AI 解析时间)"><button class="kbtn" onclick="addEv()">添加</button></div>`;
  }
  else if(tab==='files'){
    b.innerHTML=`
      <div class="dropzone" id="dz"><b>拖文件到这里(或刘海)</b><br>暂存到 Shelf → 上传到记录 / 关联驾驶舱</div>
      <div class="shelf" id="shelf">${FILES.map((f,i)=>fileHTML(f,i)).join('')||''}</div>
      <div class="rlab" style="margin-top:12px">剪贴板</div>
      <div class="wcard clip"><span class="cic">${LINK}</span>
        <span class="tx"><b>https://arxiv.org/abs/1706.03762</b> · 2 分钟前</span>

function focusHTML(){
  const pct=(1-focusLeft/focusTotal)*360;
  return `<div class="focus">

        <div class="inner"><span class="tt">${fmt(focusLeft)}</span><span class="ss">${focusRun?'专注中':'已暂停'}</span></div>
      </div>
      <div class="fright">
        <div class="lb">关联任务</div>
        <div class="task">把 NOMI 稿逐块进 Svelte</div>
        <div class="facts">
          <button class="${focusRun?'pbtn':'kbtn'}" id="fGo">${focusRun?'暂停':'开始'}</button>
          <button class="pbtn" id="fRe">重置</button>
          <button class="pbtn">换任务</button>
        </div>
      </div>

}
function bindFocus(){
  $('#fGo').onclick=()=>{focusRun=!focusRun;renderBody()};

  return `<div class="wcard file" data-i="${i}">

  </div>`;
}
function bindFileActs(){
  document.querySelectorAll('.file .a-rm').forEach(x=>x.onclick=e=>{FILES.splice(+e.target.closest('.file').dataset.i,1);renderBody()});
  document.querySelectorAll('.file .a-up,.file .a-ck').forEach(x=>x.onclick=e=>{const t=e.target.textContent;e.target.textContent='✓ 已处理';setTimeout(()=>{FILES.splice(+e.target.closest('.file').dataset.i,1);renderBody()},700)});

function addFile(n,s,c,k){FILES.unshift({n,s,c,k});if(tab==='files')renderBody();}

/* tab/panel 控制 */
const TABS=['dash','capture','cal','agents','files'];
function switchTab(t,dir){tab=t;renderTabs();renderBody();
  const b=$('#pbody'); if(dir){b.classList.remove('slide-l','slide-r');void b.offsetWidth;
    b.classList.add(dir>0?'slide-l':'slide-r');}}
let wxAcc=0,wxLock=0;
document.addEventListener('wheel',e=>{
  if(!open)return;
  if(e.target.closest('.swipe'))return;
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  const now=performance.now(); if(now<wxLock)return;
  wxAcc+=e.deltaX;
  if(Math.abs(wxAcc)>90){
    const i=TABS.indexOf(tab), d=wxAcc>0?1:-1, ni=Math.min(TABS.length-1,Math.max(0,i+d));
    if(ni!==i)switchTab(TABS[ni],d);
    wxAcc=0;wxLock=now+450;
  }
},{passive:true});
function renderTabs(){
  document.querySelectorAll('.mtab').forEach(x=>{
    x.classList.toggle('on',x.dataset.t===tab);
    x.onclick=()=>switchTab(x.dataset.t);
  });
}
function openPanel(t){const sh=$('#shell');sh.classList.remove('bannermode');open=true;sh.classList.add('open');if(t)switchTab(t)}
function closePanel(){open=false;$('#shell').classList.remove('open')}
$('#notch').onclick=e=>{if(!open)openPanel()};
/* hover 展开(对齐现行稿 helm-notch-pro):悬停刘海→开,移出刘海+面板→220ms 后收 */
let hoverT;
for(const el of [document.getElementById('shell')]){
  el.addEventListener('mouseenter',()=>{clearTimeout(hoverT);if(!open)openPanel()});
  el.addEventListener('mouseleave',()=>{clearTimeout(hoverT);
    hoverT=setTimeout(()=>{if(!$('#shell').classList.contains('bannermode'))closePanel()},220)});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();hideBanner()}});

/* banner */
function showBanner(){const sh=$('#shell');sh.classList.add('bannermode','open');open=true}
function hideBanner(){const sh=$('#shell');sh.classList.remove('bannermode');closePanel()}

/* 刘海拖文件:悬入 → 壳像 hover 一样长出 drop 承接面(2026-07-07 用户拍板) */
const notchEl=$('#shell');
let wasOpenBeforeDrag=false, dragDepth=0;
function enterDropMode(){
  if(notchEl.classList.contains('dropmode'))return;
  wasOpenBeforeDrag=open;
  notchEl.classList.add('dropmode','open');open=true;
  $('#droptarget').classList.add('hot');
}
function exitDropMode(drop){
  notchEl.classList.remove('dropmode');
  $('#droptarget').classList.remove('hot');
  if(drop){openPanel('files');}
  else if(!wasOpenBeforeDrag){closePanel();}
}
notchEl.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;enterDropMode()});
notchEl.addEventListener('dragover',e=>e.preventDefault());
notchEl.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;exitDropMode(false)}});
notchEl.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;
  exitDropMode(true);addFile('拖入的文件.png','PNG · 640 KB','#0a84ff','IM')});

/* 计时器们 */
setInterval(()=>{
  if(playing){pos=Math.min(dur,pos+1);
    const pg=document.getElementById('pg'),tA=document.getElementById('tA');
    if(pg){pg.style.width=(pos/dur*100)+'%';tA.textContent=fmt(pos)}}
  if(focusRun&&focusLeft>0){focusLeft--;
    if(tab==='capture'&&kind==='focus')renderBody()}
},1000);
function scrollLyr(){
  const roll=document.getElementById('roll'); if(!roll)return;
  const box=roll.parentElement, cur=roll.children[lyrIdx];
  roll.querySelectorAll('.lyr').forEach((el,i)=>el.classList.toggle('on',i===lyrIdx));
  if(cur)roll.style.transform=`translateY(${box.clientHeight/2 - cur.offsetTop - cur.offsetHeight/2}px)`;
}

  if(playing&&tab==='media'){lyrIdx=(lyrIdx+1)%LYRICS.length;scrollLyr();}
},3200);

renderTabs(); renderBody(); openPanel('dash');
