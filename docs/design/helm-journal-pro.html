<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm · 记录 JOURNAL 设计定稿 (Timeline / Canvas / Calendar)</title>
<!--
  HELM · JOURNAL — SOURCE OF TRUTH(记录模块,2026-07-06 用户拍板 redesign)
  参考 NOMI 的三视图(Timeline/Canvas/Calendar),翻成 ORAGE 座舱语言:
  黑/白双主题 · mono/sans 硬切 · 零圆角 · 发丝线 · 每日 accent · 禁 emoji。
  全交互:三视图切换 / Canvas 卡片拖拽+连线 / 周历 / 分类过滤 / 主题+每日色。
  进 Svelte 时以本文件 + DESIGN.md 为准——不改本文件、改代码。
-->
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
    --ease:cubic-bezier(.32,.72,0,1);
    --acc:#FFC53D; --acc-ink:#FFC53D;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--t2);overflow:hidden}

  body[data-theme="dark"]{
    --bg:#000;--chrome:#0a0a0c;--panel:#08080a;--tile:#101012;
    --t1:#fff;--t2:rgba(255,255,255,.90);--t3:rgba(255,255,255,.66);--t4:rgba(255,255,255,.48);
    --line:rgba(255,255,255,.16);--hair:rgba(255,255,255,.09);--grid:rgba(255,255,255,.035);
    --green:#34C759;--orange:#FF9F0A;--red:#FF453A;--cyan:#34D6C0;
    --cardbg:#0c0c0e;
  }
  body[data-theme="light"]{
    --bg:#efece3;--chrome:#e7e3d8;--panel:#eae6dc;--tile:#e4dfd2;
    --t1:#17140d;--t2:rgba(23,20,13,.84);--t3:rgba(23,20,13,.64);--t4:rgba(23,20,13,.48);
    --line:rgba(23,20,13,.24);--hair:rgba(23,20,13,.12);--grid:rgba(23,20,13,.05);
    --green:#2a8f43;--orange:#b56b00;--red:#c2331f;--cyan:#0e7d70;
    --cardbg:#f4f1e8;
  }

  /* ── 壳 ─────────────────────────────── */
  .app{height:100vh;display:grid;grid-template-rows:34px 1fr 26px;background:var(--bg)}
  .tbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--chrome);border-bottom:1px solid var(--hair);
    font-family:var(--mono);font-size:11px;color:var(--t4)}
  .tbar .wm{font-weight:800;letter-spacing:3px;color:var(--t2)}
  .tbar .crumb{color:var(--t3)}
  .tbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .tbtn{font-family:var(--mono);font-size:10px;color:var(--t3);background:transparent;border:1px solid var(--hair);
    padding:4px 9px;cursor:pointer;letter-spacing:.5px}
  .tbtn:hover{color:var(--t1);border-color:var(--line)}
  .tbtn.acc{color:var(--acc-ink);border-color:var(--acc-ink)}
  .sbar{display:flex;align-items:center;background:var(--chrome);border-top:1px solid var(--hair);
    font-family:var(--mono);font-size:10.5px;color:var(--t3)}
  .sbar .seg{padding:0 12px;height:26px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--hair)}
  .sbar .live{color:var(--acc-ink)}
  .sbar .grow{flex:1}

  /* ── 主区:左分类 + 内容 ───────────────── */
  .main{display:grid;grid-template-columns:200px 1fr;min-height:0}
  .side{background:var(--panel);border-right:1px solid var(--hair);padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
  .slab{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--t3);text-transform:uppercase;margin:4px 0 8px}
  .frow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);padding:6px 8px;cursor:pointer;border-left:2px solid transparent}
  .frow:hover{color:var(--t1);background:var(--hair)}
  .frow.on{color:var(--t1);border-left-color:var(--acc);background:var(--hair)}
  .frow .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--t4);font-variant-numeric:tabular-nums}
  .side .foot{margin-top:auto;font-family:var(--mono);font-size:9px;line-height:1.8;color:var(--t4);letter-spacing:.3px}
  .side .foot b{color:var(--t3)}

  .content{position:relative;min-width:0;display:flex;flex-direction:column;
    background:radial-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}

  /* 顶部:标题 + 三视图切换(mono 分段) */
  .head{display:flex;align-items:baseline;gap:14px;padding:16px 22px 0}
  .head h1{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:1px;color:var(--t1);margin:0}
  .head .zh{font-size:12px;color:var(--acc-ink);font-family:var(--mono);font-weight:700}
  .head .counts{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--t4);letter-spacing:1px}
  .views{display:flex;gap:0;padding:10px 22px 0;border-bottom:1px solid var(--hair)}
  .vtab{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--t3);background:transparent;border:none;
    padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase}
  .vtab:hover{color:var(--t1)}
  .vtab.on{color:var(--t1);border-bottom-color:var(--acc)}
  .stage{flex:1;min-height:0;position:relative;overflow:hidden}

  /* ── 通用卡片(座舱收藏卡) ───────────────── */
  .card{background:var(--cardbg);border:1px solid var(--line);position:relative;
    transition:border-color .12s var(--ease),transform .12s var(--ease)}
  .card:hover{border-color:var(--t4)}
  .card .ctag{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:1.2px;padding:7px 10px 0;display:flex;gap:8px;align-items:center}
  .card .ctag .tm{margin-left:auto;color:var(--t4);font-weight:400;font-variant-numeric:tabular-nums}
  .t-youtube{color:var(--red)} .t-paper{color:var(--cyan)} .t-inspo{color:var(--acc-ink)}
  .t-text{color:var(--t3)} .t-task{color:var(--green)} .t-event{color:var(--acc-ink)}
  .card .cbody{padding:6px 10px 9px;font-size:12.5px;color:var(--t2);line-height:1.45}
  .card .cbody b{color:var(--t1);font-weight:600}
  .card .cimg{width:100%;height:86px;object-fit:cover;display:block;border-bottom:1px solid var(--hair);
    background:linear-gradient(135deg,#3a3a44,#1c1c22)}
  .card .csum{font-size:11px;color:var(--t3);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cfoot{display:flex;gap:8px;padding:0 10px 8px;font-family:var(--mono);font-size:9px;color:var(--t4)}
  .card .cfoot .tag{color:var(--cyan)}
  /* 选中 = 框选视口 L 角 */
  .card.sel{border-color:var(--acc-ink)}
  .card.sel::before,.card.sel::after{content:"";position:absolute;width:10px;height:10px;border:1.5px solid var(--acc-ink);z-index:2}
  .card.sel::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
  .card.sel::after{bottom:-2px;right:-2px;border-left:none;border-top:none}

  /* ── TIMELINE ───────────────── */
  .v-timeline{height:100%;overflow-y:auto;padding:18px 26px}
  .dhead{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);margin:14px 0 10px}
  .dhead:first-child{margin-top:0}
  .dhead .d{font-size:12px;font-weight:700;color:var(--acc-ink);letter-spacing:.6px}
  .dhead .n{font-size:9.5px;color:var(--t4)}
  .dhead .rule{flex:1;height:1px;background:var(--hair);align-self:center}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .tgrid .card{cursor:pointer}

  /* ── CANVAS ───────────────── */
  .v-canvas{position:absolute;inset:0;overflow:hidden;cursor:default}
  .cnode{position:absolute;width:240px;cursor:grab;user-select:none}
  .cnode:active{cursor:grabbing}
  .cnode.dragging{z-index:30}
  .cnode.dragging .card{border-color:var(--acc-ink);transform:scale(1.012)}
  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .wire{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.7}
  .wiredot{fill:var(--acc)}
  .canvas-hint{position:absolute;left:22px;bottom:14px;font-family:var(--mono);font-size:9.5px;color:var(--t4);letter-spacing:.5px;z-index:5}
  .cluster{position:absolute;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.2px;color:var(--acc-ink);
    border:1px solid var(--acc-ink);padding:3px 8px;background:var(--bg);z-index:4}

  /* ── CALENDAR(周) ───────────────── */
  .v-cal{height:100%;display:flex;flex-direction:column;padding:12px 22px 0}
  .calnav{display:flex;align-items:center;gap:10px;font-family:var(--mono);margin-bottom:8px}
  .calnav .rng{font-size:12px;font-weight:700;color:var(--t1);letter-spacing:.5px}
  .calnav .nbtn{font-family:var(--mono);font-size:12px;color:var(--t3);background:transparent;border:1px solid var(--hair);
    width:24px;height:22px;cursor:pointer}
  .calnav .nbtn:hover{color:var(--t1);border-color:var(--line)}
  .calnav .today{font-size:9.5px;color:var(--acc-ink);border:1px solid var(--acc-ink);padding:3px 8px;background:transparent;cursor:pointer;letter-spacing:.6px}
  .calnav .tz{margin-left:auto;font-size:9.5px;color:var(--t4)}
  .calwrap{flex:1;overflow-y:auto;border-top:1px solid var(--hair);min-height:0}
  .calgrid{display:grid;grid-template-columns:46px repeat(7,1fr);position:relative}
  .caldayh{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);
    padding:6px 8px;font-family:var(--mono)}
  .caldayh .dw{font-size:9px;color:var(--t4);letter-spacing:1px}
  .caldayh .dn{font-size:15px;font-weight:800;color:var(--t2);font-variant-numeric:tabular-nums}
  .caldayh.istoday .dn{color:var(--acc-ink)}
  .calh0{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--hair)}
  .hcell{height:44px;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);position:relative}
  .hlabel{height:44px;font-family:var(--mono);font-size:9px;color:var(--t4);text-align:right;padding:2px 6px 0 0;
    border-bottom:1px solid transparent;transform:translateY(-6px)}
  .calcard{position:absolute;left:3px;right:3px;z-index:3;padding:4px 6px;font-size:10.5px;line-height:1.3;
    background:var(--cardbg);border:1px solid var(--line);border-left:2px solid var(--t4);overflow:hidden;cursor:pointer}
  .calcard:hover{border-color:var(--t4)}
  .calcard .ct{font-family:var(--mono);font-size:8px;letter-spacing:.8px;color:var(--t4)}
  .calcard.k-event{border-left-color:var(--acc)}
  .calcard.k-task{border-left-color:var(--green)}
  .calcard.k-note{border-left-color:var(--cyan)}
  .nowline{position:absolute;left:46px;right:0;height:0;border-top:1px solid var(--acc);z-index:5;opacity:.85}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--acc)}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line)}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <div class="tbar">
    <span class="wm">HELM</span><span class="crumb">~/helm · 记录 JOURNAL</span>
    <span class="right">
      <button class="tbtn" id="themeBtn">◐ 主题</button>
      <button class="tbtn acc" id="accBtn">◈ 今日色</button>
      <span style="letter-spacing:.5px">SOURCE OF TRUTH · v1</span>
    </span>
  </div>

  <div class="main">
    <aside class="side">
      <div class="slab">收藏 / COLLECT</div>
      <div class="frow on" data-f="all">全部<span class="k" id="kAll">0</span></div>
      <div class="frow" data-f="youtube">视频<span class="k" id="kYt">0</span></div>
      <div class="frow" data-f="paper">论文<span class="k" id="kPp">0</span></div>
      <div class="frow" data-f="inspo">灵感<span class="k" id="kIn">0</span></div>
      <div class="frow" data-f="text">速记<span class="k" id="kTx">0</span></div>
      <div class="slab" style="margin-top:14px">安排 / PLAN</div>
      <div class="frow" data-f="task">任务<span class="k" id="kTk">0</span></div>
      <div class="frow" data-f="event">日程<span class="k" id="kEv">0</span></div>
      <div class="foot">
        <div><b>AI 管线</b> 链接→parse→卡</div>
        <div><b>PROVIDER</b> 设置里选</div>
        <div><b>⌘N</b> 随手记</div>
      </div>
    </aside>

    <div class="content">
      <div class="head">
        <h1>JOURNAL</h1><span class="zh">记录</span>
        <span class="counts" id="counts">— NOTES · — TASKS · — EVENTS</span>
      </div>
      <div class="views">
        <button class="vtab" data-v="timeline">Timeline</button>
        <button class="vtab on" data-v="canvas">Canvas</button>
        <button class="vtab" data-v="calendar">Calendar</button>
      </div>
      <div class="stage" id="stage"></div>
    </div>
  </div>

  <div class="sbar">
    <span class="seg"><span class="live">●</span> ~/helm</span>
    <span class="seg" id="sview">CANVAS</span>
    <span class="seg" id="ssel">未选中</span>
    <span class="grow"></span>
    <span class="seg">AI · enrich idle</span>
    <span class="seg">⌘K 命令面板</span>
  </div>
</div>

<script>
/* ───────── mock 数据(用户真实场景) ───────── */
const YT_IMG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="86"><rect width="240" height="86" fill="#22222a"/><polygon points="108,28 108,58 136,43" fill="#FFC53D"/></svg>');
const INSPO_IMG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="86"><rect width="240" height="86" fill="#1a2430"/><rect x="18" y="18" width="60" height="50" fill="#34D6C0" opacity=".8"/><rect x="94" y="30" width="52" height="38" fill="#FFC53D" opacity=".85"/><rect x="160" y="14" width="62" height="54" fill="#7C9CFF" opacity=".8"/></svg>');

const ITEMS=[
 {id:1,type:'youtube',title:'PSY - GANGNAM STYLE M/V',site:'officialpsy',sum:'史上最具标志性的病毒式传播 MV,魔性舞蹈+现象级全球流行文化影响力。',tags:['音乐','流行文化'],img:YT_IMG,day:0,hh:2,t:'02:08',cx:600,cy:60},
 {id:2,type:'paper',title:'Attention Is All You Need',site:'arXiv',sum:'提出 Transformer:完全基于注意力机制,弃用循环与卷积,成为现代大模型的地基。',tags:['transformer','必读'],day:0,hh:1,t:'01:58',cx:330,cy:210},
 {id:3,type:'inspo',title:'Awwwards — 年度作品集合集',site:'awwwards.com',sum:'交互/视觉标杆站点合集,收藏做 Helm 视觉参考。',tags:['UI','灵感'],img:INSPO_IMG,day:0,hh:1,t:'01:51',cx:855,cy:300},
 {id:4,type:'text',title:'速记',body:'驾驶舱 e2e 的三个坑:中间件吞后台任务/事务时序/僵尸进程——写进 backlog 复盘。',t:'02:31',day:0,hh:2,cx:150,cy:420},
 {id:5,type:'text',title:'速记',body:'给 notch 加「速记→AI 整理」的入场动效,像仪表暖机。',t:'23:44',day:-1,hh:23,cx:560,cy:470},
 {id:6,type:'task',title:'汇总未读邮件',sub:'交给 agent · cron 0 9 * * *',day:1,hh:9,cx:830,cy:520},
 {id:7,type:'event',title:'站会',sub:'10:00 · 30min',day:1,hh:10},
 {id:8,type:'event',title:'1:1 · design review',sub:'15:00 · 45min',day:3,hh:15},
 {id:9,type:'task',title:'跑 swift test 夜巡',sub:'交给 agent · every 6h',day:2,hh:18},
 {id:10,type:'youtube',title:'SwiftUI Layout 深讲',site:'Sean Allen',sum:'布局系统:proposal/response 模型,frame 与 fixedSize 的真实语义。',tags:['SwiftUI'],img:YT_IMG,day:-1,hh:21,t:'21:12',cx:360,cy:560}
];
const WIRES=[[2,3],[2,10],[1,3]]; // 论文→灵感/视频 的思路连线(id 对)

/* ───────── 状态 ───────── */
let view='canvas', filter='all', selId=null;
const PAL=['#FB9E66','#FF6F61','#FFC53D','#B6E84F','#34D6C0','#4FD6E8','#5EA0FF','#7C9CFF','#B98CFF','#FF6FA5'];
let accIdx=2;
const $=s=>document.querySelector(s), stage=$('#stage');

/* ───────── 通用卡 ───────── */
const TAGNAME={youtube:'YOUTUBE',paper:'PAPER',inspo:'INSPO',text:'速记',task:'任务',event:'日程'};
function cardHTML(it,compact=false){
  const tag=`<div class="ctag t-${it.type}">${TAGNAME[it.type]}${it.t?`<span class="tm">${it.t}</span>`:''}</div>`;
  const img=it.img&&!compact?`<img class="cimg" src="${it.img}" alt="">`:'';
  const body=it.type==='text'
    ?`<div class="cbody">${it.body}</div>`
    :`<div class="cbody"><b>${it.title}</b>${it.sum?`<div class="csum">${it.sum}</div>`:''}${it.sub?`<div class="csum">${it.sub}</div>`:''}</div>`;
  const foot=(it.site||it.tags)?`<div class="cfoot">${it.site?`<span>${it.site}</span>`:''}${(it.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`:'';
  return `<div class="card${selId===it.id?' sel':''}" data-id="${it.id}">${img}${tag}${body}${foot}</div>`;
}
const fitems=()=>ITEMS.filter(i=>filter==='all'||i.type===filter);

/* ───────── TIMELINE ───────── */
function renderTimeline(){
  const groups={};
  fitems().forEach(i=>{(groups[i.day]??=[]).push(i)});
  const label=d=>d===0?'今天 · 07-06':d===-1?'昨天 · 07-05':d>0?`07-0${6+d}(计划)`:`07-0${6+d}`;
  stage.innerHTML=`<div class="v-timeline">${Object.keys(groups).sort((a,b)=>b-a).map(d=>`
    <div class="dhead"><span class="d">${label(+d)}</span><span class="n">${groups[d].length} 项</span><span class="rule"></span></div>
    <div class="tgrid">${groups[d].map(i=>cardHTML(i)).join('')}</div>`).join('')}</div>`;
}

/* ───────── CANVAS ───────── */
function renderCanvas(){
  stage.innerHTML=`<div class="v-canvas" id="cv">
    <svg class="wires" id="wires"></svg>
    <span class="cluster" style="left:330px;top:168px">◈ TRANSFORMER 思路串</span>
    ${fitems().filter(i=>i.cx!=null).map(i=>`<div class="cnode" data-id="${i.id}" style="left:${i.cx}px;top:${i.cy}px">${cardHTML(i)}</div>`).join('')}
    <span class="canvas-hint">拖动卡片自由摆放 · 连线 = 思路关联(accent) · 点击选中(L 角)</span>
  </div>`;
  drawWires();
  // 拖拽
  document.querySelectorAll('.cnode').forEach(node=>{
    node.addEventListener('pointerdown',e=>{
      const id=+node.dataset.id; select(id);
      const it=ITEMS.find(x=>x.id===id);
      const sx=e.clientX-it.cx, sy=e.clientY-it.cy;
      node.classList.add('dragging'); node.setPointerCapture(e.pointerId);
      const move=ev=>{it.cx=Math.max(0,ev.clientX-sx);it.cy=Math.max(0,ev.clientY-sy);
        node.style.left=it.cx+'px';node.style.top=it.cy+'px';drawWires();};
      const up=()=>{node.classList.remove('dragging');node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',up);};
      node.addEventListener('pointermove',move);node.addEventListener('pointerup',up);
    });
  });
}
function drawWires(){
  const svg=$('#wires'); if(!svg)return;
  const P=id=>{const it=ITEMS.find(x=>x.id===id);return it&&it.cx!=null?[it.cx+120,it.cy+52]:null};
  svg.innerHTML=WIRES.map(([a,b])=>{
    const p=P(a),q=P(b); if(!p||!q)return'';
    const mx=(p[0]+q[0])/2;
    return `<path class="wire" d="M${p[0]},${p[1]} C${mx},${p[1]} ${mx},${q[1]} ${q[0]},${q[1]}"/>
      <circle class="wiredot" cx="${p[0]}" cy="${p[1]}" r="3"/><circle class="wiredot" cx="${q[0]}" cy="${q[1]}" r="3"/>`;
  }).join('');
}

/* ───────── CALENDAR ───────── */
let weekOff=0;
function renderCalendar(){
  const H0=8,H1=22,rows=H1-H0;
  const days=['一','二','三','四','五','六','日'];
  const dates=[6,7,8,9,10,11,12].map(d=>d+weekOff*7);
  const cells=[];
  for(let h=H0;h<H1;h++){
    cells.push(`<div class="hlabel">${String(h).padStart(2,'0')}:00</div>`);
    for(let d=0;d<7;d++){
      const todays=fitems().filter(i=>i.hh===h&&(i.day??null)!==null&&i.day===d-0+weekOff*7-0&&['task','event','note','text'].includes(i.type)===false?false:(i.hh===h&&i.day===(d)+weekOff*7-0));
      cells.push(`<div class="hcell" data-d="${d}" data-h="${h}"></div>`);
    }
  }
  stage.innerHTML=`<div class="v-cal">
    <div class="calnav">
      <button class="nbtn" id="wPrev">‹</button>
      <span class="rng" id="wRng">07-06 — 07-12 · W28${weekOff?`(${weekOff>0?'+':''}${weekOff}周)`:''}</span>
      <button class="nbtn" id="wNext">›</button>
      <button class="today" id="wToday">今天</button>
      <span class="tz">GMT+8 · 本地</span>
    </div>
    <div class="calwrap"><div class="calgrid" id="cg">
      <div class="calh0"></div>
      ${days.map((w,i)=>`<div class="caldayh${i===0&&weekOff===0?' istoday':''}"><div class="dw">周${w}</div><div class="dn">${String(dates[i]).padStart(2,'0')}</div></div>`).join('')}
      ${cells.join('')}
    </div></div>
  </div>`;
  // 落卡:day 0=周一(今天) … 相对本周
  const cg=$('#cg');
  fitems().forEach(i=>{
    if(i.day==null||i.hh==null)return;
    const d=i.day-weekOff*7; if(d<0||d>6)return;
    const h=i.hh; if(h<H0||h>=H1)return;
    const cell=cg.querySelector(`.hcell[data-d="${d}"][data-h="${h}"]`); if(!cell)return;
    const k=i.type==='event'?'k-event':i.type==='task'?'k-task':'k-note';
    const el=document.createElement('div');
    el.className=`calcard ${k}`; el.style.top='2px'; el.dataset.id=i.id;
    el.innerHTML=`<div class="ct">${TAGNAME[i.type]}${i.t?' · '+i.t:''}</div>${i.title==='速记'?(i.body||'').slice(0,26)+'…':i.title}`;
    cell.appendChild(el);
  });
  // 当前时刻线(demo 定在 14:20)
  if(weekOff===0){
    const headH=cg.querySelector('.caldayh')?.offsetHeight ?? 41;
    const y=(14-H0)*44+Math.round(44*20/60)+headH; // demo 当前时刻 14:20
    const line=document.createElement('div');
    line.className='nowline'; line.style.top=y+'px';
    cg.appendChild(line);
  }
  $('#wPrev').onclick=()=>{weekOff--;renderCalendar()};
  $('#wNext').onclick=()=>{weekOff++;renderCalendar()};
  $('#wToday').onclick=()=>{weekOff=0;renderCalendar()};
}

/* ───────── 切换/选中/计数 ───────── */
function render(){
  ({timeline:renderTimeline,canvas:renderCanvas,calendar:renderCalendar})[view]();
  $('#sview').textContent=view.toUpperCase();
}
function select(id){
  selId=id;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.id===id));
  const it=ITEMS.find(x=>x.id===id);
  $('#ssel').textContent=it?`#${id} ${TAGNAME[it.type]} · ${it.title}`.slice(0,40):'未选中';
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.card,.calcard'); if(c&&c.dataset.id)select(+c.dataset.id);
});
document.querySelectorAll('.vtab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.vtab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); view=b.dataset.v; render();
});
document.querySelectorAll('.frow').forEach(r=>r.onclick=()=>{
  document.querySelectorAll('.frow').forEach(x=>x.classList.remove('on'));
  r.classList.add('on'); filter=r.dataset.f; render();
});
function counts(){
  const n=t=>ITEMS.filter(i=>i.type===t).length;
  kAll.textContent=ITEMS.length; kYt.textContent=n('youtube'); kPp.textContent=n('paper');
  kIn.textContent=n('inspo'); kTx.textContent=n('text'); kTk.textContent=n('task'); kEv.textContent=n('event');
  $('#counts').textContent=`${String(n('youtube')+n('paper')+n('inspo')+n('text')).padStart(3,'0')} NOTES · ${String(n('task')).padStart(3,'0')} TASKS · ${String(n('event')).padStart(3,'0')} EVENTS`;
}
/* 主题/每日色 */
$('#themeBtn').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'};
$('#accBtn').onclick=()=>{accIdx=(accIdx+1)%PAL.length;
  const c=PAL[accIdx];document.documentElement.style.setProperty('--acc',c);
  const dark=document.body.dataset.theme==='dark';
  document.documentElement.style.setProperty('--acc-ink',dark?c:'#8a6410');};

counts(); render();
</script>
