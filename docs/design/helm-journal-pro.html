<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm · NOMI 风全站设计定稿(今日/记录/对话/研究/驾驶舱/设置)</title>
<!--
  HELM — SOURCE OF TRUTH(全站 NOMI 风 redesign,2026-07-06 用户拍板)
  参考 nomi-reference/ 两图 + 用户提供的方框娃娃脸 logo(全局启用,#271C11)。
  风格:纯白近白底 · 大圆角白卡 · 多层柔和阴影 · 无边框线(留白分层) ·
  黑胶囊切换 · 橙→紫渐变(连线/cluster/FAB/进度) · 禁 emoji(SVG/色块字母)。
  板块:今日 TODAY / 记录 JOURNAL(Timeline·Canvas·Calendar) / 对话 CHAT /
  研究 RESEARCH / 驾驶舱 COCKPIT / 设置 SETTINGS —— 全部可交互。
  进 Svelte 时以本文件 + DESIGN.md 为准:不改本文件、改代码。
-->
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --bg:#f6f6f7; --side:#ffffff; --card:#ffffff;
    --ink:#111114; --ink2:#5c5c66; --ink3:#a2a2ab;
    --logo:#271C11;
    --hair:#ececef; --pill:#f1f1f3;
    --g1:#ff8a3d; --g2:#a855f7;
    --ok:#28a745;
    --shadow:0 1px 2px rgba(17,17,20,.05),0 6px 18px rgba(17,17,20,.07);
    --shadow-lg:0 2px 6px rgba(17,17,20,.06),0 16px 40px rgba(17,17,20,.12);
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{height:100vh;display:grid;grid-template-columns:250px 1fr}

  /* ── 侧栏:全局导航 ─────────────── */
  .side{background:var(--side);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:22px 18px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .brand svg{flex:none}
  .brand .nm{font-weight:700;font-size:15px}
  .brand .collapse{margin-left:auto;width:26px;height:26px;border:1px solid var(--hair);border-radius:8px;background:#fff;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
  .navs{display:flex;flex-direction:column;gap:2px}
  .nav{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--ink2);padding:9px 14px;border-radius:12px;cursor:pointer}
  .nav:hover{background:var(--pill)}
  .nav.on{background:var(--pill);color:var(--ink);font-weight:600}
  .nav svg{width:17px;height:17px;flex:none}
  .nav .k{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .subhead{font-size:11px;color:var(--ink3);letter-spacing:.4px;margin:18px 14px 6px;text-transform:uppercase}
  .cats{display:none;flex-direction:column;gap:2px}
  .cats.show{display:flex}
  .cat{font-size:13px;color:var(--ink2);padding:7px 14px;border-radius:10px;cursor:pointer;display:flex}
  .cat:hover{background:var(--pill)}
  .cat.on{background:var(--pill);color:var(--ink);font-weight:600}
  .cat .k{margin-left:auto;font-size:11px;color:var(--ink3)}
  .sidefoot{margin-top:auto;display:flex;gap:10px}
  .roundbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
  .roundbtn:hover{border-color:var(--ink3)}
  .roundbtn svg{width:18px;height:18px}

  /* ── 主区通用 ─────────────── */
  .main{position:relative;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:16px;padding:16px 24px 8px;z-index:8;min-height:56px}
  .pilltabs{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .ptab{font-size:13px;color:var(--ink2);background:transparent;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;transition:all .18s var(--ease)}
  .ptab.on{background:var(--ink);color:#fff;font-weight:600}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
  .navbtn{width:32px;height:32px;border-radius:50%;background:var(--pill);border:none;color:var(--ink2);cursor:pointer;font-size:13px}
  .navbtn:hover{background:#e8e8ec}
  .stage{flex:1;min-height:0;position:relative;overflow:hidden}
  .htitle{font-size:22px;font-weight:800;letter-spacing:-.2px}
  .hsub{font-size:13px;color:var(--ink3)}
  .blackbtn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer}

  /* ── 卡片 ─────────────── */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);position:relative;transition:box-shadow .18s var(--ease)}
  .card:hover{box-shadow:var(--shadow-lg)}
  .card .pad{padding:14px 16px 10px}
  .appic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;margin-bottom:9px}
  .ic-yt{background:#ff2d2d}.ic-ax{background:#8b5a2b}.ic-aw{background:linear-gradient(135deg,#34d6c0,#0a84ff)}
  .ic-tx{background:#111114}.ic-tk{background:var(--ok)}.ic-ev{background:linear-gradient(135deg,var(--g1),var(--g2))}
  .card .ti{font-size:14px;font-weight:600;line-height:1.35}
  .card .sum{font-size:12px;color:var(--ink2);line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;align-items:center;padding:6px 16px 12px;color:var(--ink3)}
  .card .foot svg{width:13px;height:13px}
  .card .foot .tm{margin-left:auto;font-size:10.5px}
  .card .cover{width:100%;aspect-ratio:16/7.2;object-fit:cover;border-radius:16px 16px 0 0;display:block}
  .card.imgcard{background:#0d0d10;overflow:hidden}
  .card.imgcard .cover{border-radius:16px;aspect-ratio:16/9}
  .card.imgcard .tmpill{position:absolute;right:10px;bottom:10px;background:rgba(17,17,20,.72);color:#fff;font-size:10px;padding:4px 10px;border-radius:999px}
  .card.sel{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--g2),var(--shadow-lg)}

  /* ── TODAY ─────────────── */
  .v-today{height:100%;overflow-y:auto;padding:10px 28px 30px}
  .greet{margin:8px 4px 18px}
  .greet .hi{font-size:26px;font-weight:800;letter-spacing:-.3px}
  .greet .sub{font-size:13.5px;color:var(--ink3);margin-top:4px}
  .capbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;box-shadow:var(--shadow);padding:6px 6px 6px 20px;margin-bottom:22px}
  .capbar input{flex:1;border:none;outline:none;font-size:14px;font-family:var(--sans);color:var(--ink);background:transparent}
  .capbar input::placeholder{color:var(--ink3)}
  .capbar .kinds{display:flex;gap:4px}
  .kindchip{font-size:11.5px;color:var(--ink2);background:var(--pill);border:none;border-radius:999px;padding:6px 12px;cursor:pointer}
  .kindchip.on{background:var(--ink);color:#fff}
  .capbar .send{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer}
  .tgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .stat{display:flex;align-items:baseline;gap:6px}
  .stat .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .stat .u{font-size:12px;color:var(--ink3)}
  .rowline{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);padding:7px 0;border-top:1px solid var(--hair)}
  .rowline:first-of-type{border-top:none}
  .rowline .dotc{width:8px;height:8px;border-radius:3px;flex:none}
  .rowline .r{margin-left:auto;font-size:11px;color:var(--ink3)}
  .ghost{font-size:12px;color:var(--ink3);padding:8px 0}
  .minipill{display:inline-block;font-size:11.5px;background:var(--pill);border-radius:999px;padding:5px 12px;color:var(--ink2);cursor:pointer;margin-right:6px}
  .minipill:hover{background:#e8e8ec;color:var(--ink)}
  .aibtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--hair);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--ink2);cursor:pointer}
  .aibtn .spark{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 210deg,var(--g1),var(--g2),var(--g1))}

  /* ── JOURNAL(三视图) ─────────────── */
  .v-timeline{height:100%;overflow-y:auto;padding:6px 26px 30px}
  .dhead{display:flex;align-items:baseline;gap:10px;margin:18px 4px 12px}
  .dhead .d{font-size:13px;font-weight:700}
  .dhead .n{font-size:11px;color:var(--ink3)}
  .jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .jgrid .card{cursor:pointer}
  .v-canvas{position:absolute;inset:0;overflow:hidden}
  .cnode{position:absolute;width:250px;cursor:grab;user-select:none}
  .cnode:active{cursor:grabbing}
  .cnode.dragging{z-index:30}
  .cnode.dragging .card{box-shadow:var(--shadow-lg);transform:scale(1.01)}
  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .wiredot-a{fill:var(--g1)}.wiredot-b{fill:var(--g2)}
  .cluster{position:absolute;z-index:5;display:flex;align-items:center;gap:8px}
  .cluster .pillg{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;font-size:12px;font-weight:600;padding:7px 16px;border-radius:999px;box-shadow:var(--shadow)}
  .cluster .ok{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  .cluster .ok svg{width:13px;height:13px}
  .fab{position:absolute;right:22px;bottom:20px;width:44px;height:44px;border-radius:50%;background:conic-gradient(from 210deg,var(--g1),var(--g2),var(--g1));box-shadow:var(--shadow-lg);z-index:6;cursor:pointer;border:none}
  .v-cal{height:100%;display:flex;flex-direction:column;padding:0 24px}
  .calwrap{flex:1;overflow-y:auto;min-height:0}
  .calgrid{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative}
  .caldayh{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 8px 12px;text-align:center}
  .caldayh .dw{font-size:12px;color:var(--ink3)}
  .caldayh .dn{font-size:14px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
  .caldayh.istoday .dn,.caldayh.istoday .dw{color:var(--ink);font-weight:700}
  .calh0{position:sticky;top:0;z-index:6;background:var(--bg)}
  .hcell{height:54px;border-left:1px dashed #e6e6ea;position:relative}
  .hlabel{height:54px;font-size:11px;color:var(--ink3);text-align:right;padding-right:10px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
  .calcard{position:absolute;left:5px;right:5px;z-index:3;padding:10px 12px;background:#fff;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
  .calcard:hover{box-shadow:var(--shadow-lg);z-index:4}
  .calcard .when{font-size:10.5px;color:var(--ink3)}
  .calcard .t{font-size:13px;font-weight:600;line-height:1.3;margin-top:2px}
  .calcard .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2);background:var(--pill);border-radius:999px;padding:3px 9px;margin-top:6px}
  .calcard .badge .dot{width:7px;height:7px;border-radius:2px}
  .nowline{position:absolute;left:52px;right:0;height:0;border-top:1.5px solid var(--g1);z-index:5}
  .nowline::before{content:"";position:absolute;left:-4.5px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--g1)}

  /* ── CHAT ─────────────── */
  .v-chat{height:100%;display:grid;grid-template-columns:270px 1fr;min-height:0}
  .convs{overflow-y:auto;padding:4px 14px 20px 24px}
  .conv{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .conv:hover{box-shadow:var(--shadow-lg)}
  .conv.on{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink),var(--shadow)}
  .conv .t{font-size:13px;font-weight:600}
  .conv .p{font-size:11.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chatpane{display:flex;flex-direction:column;min-height:0;padding:0 24px 18px 10px}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 6px 14px}
  .msg{max-width:72%;font-size:13.5px;line-height:1.55}
  .msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px}
  .msg.ai{align-self:flex-start;background:#fff;border-radius:18px 18px 18px 4px;padding:12px 16px;box-shadow:var(--shadow)}
  .msg.ai .who{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);margin-bottom:6px}
  .msg.ai .who .spark{width:13px;height:13px;border-radius:50%;background:conic-gradient(from 210deg,var(--g1),var(--g2),var(--g1))}
  .chatinput{display:flex;gap:10px;background:#fff;border-radius:999px;box-shadow:var(--shadow);padding:6px 6px 6px 20px}
  .chatinput input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--ink);font-family:var(--sans)}

  /* ── RESEARCH ─────────────── */
  .v-research{height:100%;overflow-y:auto;padding:6px 28px 30px}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:14px}
  .prog{height:6px;border-radius:99px;background:var(--pill);overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .6s var(--ease)}
  .statuschip{display:inline-flex;align-items:center;gap:6px;font-size:11px;border-radius:999px;padding:4px 11px;font-weight:600}
  .st-run{background:#fff4e8;color:#c05e00}
  .st-done{background:#e9f8ee;color:#177a36}
  .srcrow{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .src{font-size:10.5px;color:var(--ink2);background:var(--pill);border-radius:999px;padding:4px 10px}

  /* ── COCKPIT ─────────────── */
  .v-cockpit{height:100%;overflow-y:auto;padding:6px 28px 30px}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:14px}
  .agentcard .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
  .agentcard .st{width:9px;height:9px;border-radius:50%;flex:none}
  .st-live{background:var(--ok);box-shadow:0 0 0 4px #e9f8ee}
  .st-idle{background:var(--ink3);box-shadow:0 0 0 4px var(--pill)}
  .agentcard .nm{font-size:14px;font-weight:600}
  .agentcard .proj{margin-left:auto;font-size:11px;color:var(--ink3)}
  .term{margin:12px 16px 14px;background:#0d0d10;border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:11px;line-height:1.7;color:#c8c8d0;max-height:110px;overflow:hidden}
  .term .okt{color:#5ad07a}.term .dim{color:#71717c}
  .runrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--ink2)}
  .runrow .r{margin-left:auto;font-size:11px;color:var(--ink3)}

  /* ── SETTINGS ─────────────── */
  .v-settings{height:100%;overflow-y:auto;padding:6px 28px 30px}
  .sgrid{max-width:640px;display:flex;flex-direction:column;gap:16px;margin-top:14px}
  .setrow{display:flex;align-items:center;gap:14px;padding:14px 18px}
  .setrow+.setrow{border-top:1px solid var(--hair)}
  .setrow .lb{font-size:13.5px;font-weight:600}
  .setrow .ds{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .setrow .ctl{margin-left:auto;flex:none}
  .sel{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--pill);border:none;border-radius:999px;padding:8px 14px;outline:none;cursor:pointer}
  .switch{width:44px;height:26px;border-radius:99px;background:var(--pill);position:relative;cursor:pointer;border:none;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:left .18s var(--ease)}
  .switch.on{background:linear-gradient(90deg,var(--g1),var(--g2))}
  .switch.on::after{left:21px}
  .okdot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:7px}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:#dcdce0;border-radius:99px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<!-- 用户提供的 Helm logo(方框娃娃脸,全局启用) -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="helm-logo" viewBox="0 0 24 18" fill="none">
    <path d="M22.222 0.888916H0.888672V16.9254H22.222V0.888916Z" stroke="currentColor" stroke-width="1.77778"/>
    <path d="M4.02295 10.074H5.82473C7.83554 10.074 9.46562 11.7041 9.46562 13.7149V14.0588H4.02295V10.074Z" fill="currentColor"/>
    <path d="M12.7217 10.074H14.5235C16.5343 10.074 18.1644 11.7041 18.1644 13.7149V14.0588H12.7217V10.074Z" fill="currentColor"/>
    <path d="M3.24561 8.89044C4.3147 8.09671 7.05548 6.9855 9.4658 8.89044" stroke="currentColor" stroke-width="1.77778" stroke-linecap="round"/>

<div class="app">
  <!-- 全局侧栏 -->
  <aside class="side">
    <div class="brand">
      <svg width="26" height="20" style="color:var(--logo)"><use href="#helm-logo"/></svg>
      <span class="nm">Helm</span>
      <span class="collapse">⇥</span>
    </div>
    <div class="navs" id="navs">
      <div class="nav on" data-m="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>
        今日
      </div>
      <div class="nav" data-m="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
        记录<span class="k">10</span>
      </div>
      <div class="nav" data-m="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 01-8 8H4l2.4-2.4A8 8 0 1121 12z"/></svg>
        对话<span class="k">3</span>
      </div>
      <div class="nav" data-m="research">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        研究<span class="k">2</span>
      </div>
      <div class="nav" data-m="cockpit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        驾驶舱<span class="k">1</span>

function renderCanvas(){

  drawWires();
  document.querySelectorAll('.cnode').forEach(node=>{
    node.addEventListener('pointerdown',e=>{
      const id=+node.dataset.id; select(id);
      const it=ITEMS.find(x=>x.id===id);
      const sx=e.clientX-it.cx, sy=e.clientY-it.cy;
      node.classList.add('dragging'); node.setPointerCapture(e.pointerId);
      const mv=ev=>{it.cx=Math.max(0,ev.clientX-sx);it.cy=Math.max(0,ev.clientY-sy);
        node.style.left=it.cx+'px';node.style.top=it.cy+'px';drawWires();};
      const up=()=>{node.classList.remove('dragging');node.removeEventListener('pointermove',mv);node.removeEventListener('pointerup',up);};
      node.addEventListener('pointermove',mv);node.addEventListener('pointerup',up);
    });
  });
}
function drawWires(){
  const g=document.getElementById('wg-paths'); if(!g)return;
  const P=id=>{const it=ITEMS.find(x=>x.id===id);return it&&it.cx!=null?[it.cx+125,it.cy+70]:null};

    const mx=(p[0]+q[0])/2;
    return `<path d="M${p[0]},${p[1]} C${mx},${p[1]} ${mx},${q[1]} ${q[0]},${q[1]}" fill="none" stroke="url(#wg)" stroke-width="2.5" opacity=".9"/>
      <circle class="wiredot-a" cx="${p[0]}" cy="${p[1]}" r="5"/><circle class="wiredot-b" cx="${q[0]}" cy="${q[1]}" r="5"/>`;
  }).join('');
}
function renderCalendar(){

  const days=['Mon','Tues','Wed','Thu','Fri','Sat','Sun'];
  const dates=[6,7,8,9,10,11,12].map(d=>d+weekOff*7);

  for(let h=H0;h<H1;h++){
    cells+=`<div class="hlabel">${String(h).padStart(2,'0')}:00</div>`;
    for(let d=0;d<7;d++)cells+=`<div class="hcell" data-d="${d}" data-h="${h}"></div>`;
  }
  stage.innerHTML=`<div class="v-cal"><div class="calwrap"><div class="calgrid" id="cg">
    <div class="calh0"></div>
    ${days.map((w,i)=>`<div class="caldayh${i===0&&weekOff===0?' istoday':''}"><div class="dw">${w}</div><div class="dn">${String(dates[i]).padStart(2,'0')}</div></div>`).join('')}
    ${cells}</div></div></div>`;
  const cg=$('#cg');
  fitems().forEach(i=>{
    if(i.day==null||i.hh==null)return;
    const d=i.day-weekOff*7; if(d<0||d>6||i.hh<H0||i.hh>=H1)return;
    const cell=cg.querySelector(`.hcell[data-d="${d}"][data-h="${i.hh}"]`); if(!cell)return;

    const kind=i.type==='event'?['#a855f7','日程']:i.type==='task'?['#28a745','任务']:['#0a84ff','速记'];
    el.innerHTML=`<div class="when">${i.t??String(i.hh).padStart(2,'0')+':00'}</div>
      <div class="t">${i.type==='text'?(i.body||'').slice(0,20)+'…':i.title}</div>
      ${i.sub||i.type==='event'?`<span class="badge"><span class="dot" style="background:${kind[0]}"></span>${kind[1]}</span>`:''}`;
    cell.appendChild(el);
  });
  if(weekOff===0){
    const headH=cg.querySelector('.caldayh')?.offsetHeight??54;
    const line=document.createElement('div');
    line.className='nowline';
    line.style.top=((14-H0)*54+Math.round(54*20/60)+headH)+'px';
    cg.appendChild(line);
  }
}

/* ═══ 路由 ═══ */
function render(){
  ({today:renderToday,journal:renderJournal,chat:renderChat,
    research:renderResearch,cockpit:renderCockpit,settings:renderSettings})[mode]();
  $('#catHead').style.display=mode==='journal'?'block':'none';
  $('#cats').classList.toggle('show',mode==='journal');
}
function select(id){
  selId=id;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.id===id));
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.card[data-id],.calcard'); if(c&&c.dataset.id)select(+c.dataset.id);
});
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));
  n.classList.add('on'); mode=n.dataset.m; render();
});
document.querySelectorAll('.cat').forEach(r=>r.onclick=()=>{
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
  r.classList.add('on'); filter=r.dataset.f; if(mode==='journal')renderJournal();
});
(function counts(){
  const n=t=>ITEMS.filter(i=>i.type===t).length;
  kAll.textContent=ITEMS.length;kYt.textContent=n('youtube');kPp.textContent=n('paper');
  kIn.textContent=n('inspo');kTx.textContent=n('text');kTk.textContent=n('task');kEv.textContent=n('event');
})();
render();
</script>
