<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helm Notch Pro — 多模块刘海中枢(交互原型)</title>
<!--
============================================================================
 设计说明(把设计稿放进 HTML)
============================================================================
 在 layout-AD.html(2×2 原型)基础上,升级成 MacNotch 式「多模块刘海中枢」。
 折叠态:贴刘海一条黑,左=媒体(封面+均衡器),右=状态字形(✻运行/琥珀等权限/无则今日下个日程)。
 hover 展开:顶部模块 dock 切换 8 个模块。每日强调色自动轮换(palette[dayIndex%10])。

 模块:
 1) Dashboard — 不对称 bento:大媒体卡(可点开)+ 日历卡 + agent 卡 + 速记快捷条。不再四等分。
 2) Media — 点封面放大:封面模糊铺背景 + 歌词滚动(高亮当前句)+ 可拖进度 + 控制。
 3) 速记 — kind tab(速记/日记/任务)+ 大输入 + 最近记录列表;发送进 Helm /api/notes|tasks。
 4) Calendar — 独立:周条 + 今日事件列 + 加事件;接 Helm /api/calendar。
 5) Files — 真拖拽文件到刘海 → Shelf 暂存 → 上传到 Helm(记录)/ 关联 Cockpit / 移除。
 6) Agents — 本机 Claude Code 监听:session 列表 + 权限横幅(diff+Allow/Deny)+ 提问横幅。
 7) Clipboard — 剪贴板历史:最近复制项,点→重新复制 / 存为速记。
 8) Focus — 番茄钟:25:00 计时,start/pause/reset,关联当前任务。
 (+ Quick Ask:速记 tab 里「问大脑」直接问 Helm。)

 交互:dock 点击切模块;媒体点封面切歌词态;文件拖入/拖出;速记打字;番茄计时;日历加事件。
 配色:黑底,每日强调色,状态色(绿/橙/红)语义固定。
============================================================================
-->
<style>
  :root{
    --accent:#FFC53D;
    --green:#34C759;--orange:#FF9F0A;--cyan:#34D6C0;--blue:#0A84FF;--red:#FF453A;--purple:#7B61FF;
    --t1:#fff;--t2:rgba(255,255,255,.56);--t3:rgba(255,255,255,.34);--hair:rgba(255,255,255,.09);
    --tile:#1a1a1c;--tile2:#262628;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Rounded","Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;color:var(--t1);overflow-x:hidden;
    background:linear-gradient(135deg,#3a2f52,#1c2840 50%,#0e1a22),radial-gradient(900px 500px at 70% 30%,rgba(255,180,120,.16),transparent)}
  .menubar{position:fixed;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:13px;color:#fff;z-index:2}
  .menubar .ml{display:flex;gap:16px;font-weight:600}.menubar .mr{margin-left:auto;display:flex;gap:13px;font-size:12px;opacity:.9}
  .hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.55);line-height:1.7}
  .hint b{color:#fff}

  /* ===== notch ===== */
  .stage{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:10}
  .notch{position:relative;background:var(--notchbg,#000);overflow:hidden;color:#fff;
    width:var(--cw,360px);height:var(--ch,30px);border-radius:0 0 16px 16px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    transition:width .46s cubic-bezier(.32,.72,0,1),height .46s cubic-bezier(.32,.72,0,1),border-radius .4s}
  .notch.open{width:var(--ew,700px);height:var(--eh,244px);border-radius:0 0 26px 26px}
  .notch.banner{width:620px;height:208px;border-radius:0 0 26px 26px}
  .notch.remind{width:560px;height:152px;border-radius:0 0 26px 26px}
  .notch.drag{outline:2px dashed rgba(255,197,61,.7);outline-offset:-6px}
  .notch::before,.notch::after{content:"";position:absolute;top:0;width:13px;height:13px;background:var(--notchbg,#000);pointer-events:none}
  .notch::before{left:-13px;-webkit-mask:radial-gradient(13px at 0 13px,transparent 98%,#000)}
  .notch::after{right:-13px;-webkit-mask:radial-gradient(13px at 13px 13px,transparent 98%,#000)}
  /* ===== 材质(notch 背景质感) ===== */
  .notch.mat-darkglass{--notchbg:rgba(16,18,20,.6);-webkit-backdrop-filter:blur(26px) saturate(1.35);backdrop-filter:blur(26px) saturate(1.35);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.08)}
  .notch.mat-lightglass{--notchbg:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.22)}
  .notch.mat-vibrant{--notchbg:rgba(18,20,30,.4);-webkit-backdrop-filter:blur(36px) saturate(2);backdrop-filter:blur(36px) saturate(2);box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.12)}

  /* collapsed */
  #bar{position:absolute;top:0;left:0;right:0;height:30px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:opacity .14s;z-index:4}
  .notch.open #bar,.notch.banner #bar{opacity:0;pointer-events:none}
  .cl{justify-self:end;display:flex;align-items:center;gap:7px;padding-right:14px}
  .cc{width:160px;height:30px;position:relative}.cc .lens{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#0c0c0c;box-shadow:inset 0 0 0 1px #2c2c2c}
  .cr{justify-self:start;display:flex;align-items:center;gap:6px;padding-left:14px}
  .mart{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,#e8a07a,#b56a8f 55%,#6a4f8f)}
  .eqp{display:inline-flex;align-items:flex-end;gap:2px;height:11px}.eqp i{width:2px;border-radius:1px;background:var(--accent);animation:eq .9s ease-in-out infinite}
  .eqp i:nth-child(2){animation-delay:-.3s}.eqp i:nth-child(3){animation-delay:-.55s}.eqp i:nth-child(4){animation-delay:-.15s}
  @keyframes eq{0%,100%{height:3px}50%{height:11px}}
  .cnp{font-size:10px;color:var(--t2);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cstar{color:var(--accent);font-size:12px;animation:cspin 1.1s ease-in-out infinite;display:inline-block}
  @keyframes cspin{0%{transform:rotate(0) scale(.85);opacity:.6}50%{transform:rotate(180deg) scale(1.12);opacity:1}100%{transform:rotate(360deg) scale(.85);opacity:.6}}
  .cct{font-size:11px;font-weight:700}
  .cev{font-size:10px;color:var(--t2)}.cev b{color:var(--accent)}

  /* panel + dock */
  #panel{position:absolute;inset:0;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .42s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
  .notch.open #panel,.notch.banner #panel{opacity:1;transform:translateY(0);transition:opacity .34s ease .12s,transform .46s cubic-bezier(.32,.72,0,1) .1s}
  .notch.banner #dock{display:none}
  /* ===== notch 顶栏(logo + 设置) ===== */
  .ntop{flex:none;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 13px}
  .nlogo{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}
  .nlogoic{width:16px;height:16px;color:var(--accent);display:inline-flex}
  .nlogoic svg{width:16px;height:16px}
  .nset{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;transition:.12s}
  .nset svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nset:hover{background:rgba(255,255,255,.1);color:#fff}
  .notch.banner .ntop,.notch.remind .ntop{display:none}
  /* ===== Settings 弹窗(modal) ===== */
  .setmask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .setmask.show{opacity:1;pointer-events:auto}
  .setdlg{width:440px;max-width:92vw;max-height:80vh;background:#161719;border:.5px solid var(--hair);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;transform:scale(.95);transition:transform .24s cubic-bezier(.32,.72,0,1)}
  .setmask.show .setdlg{transform:scale(1)}
  .setdlg .dh{display:flex;align-items:center;gap:8px;padding:15px 18px;border-bottom:.5px solid var(--hair)}
  .setdlg .dh .dt{font-size:15px;font-weight:800}
  .setdlg .dh .dv{margin-left:auto;font-size:10px;color:var(--t3);font-family:ui-monospace,monospace}
  .setdlg .dx{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;font-size:12px}
  .setdlg .dx:hover{background:rgba(255,255,255,.18);color:#fff}
  .setbody{padding:4px 18px 18px;overflow-y:auto}
  .setbody::-webkit-scrollbar{width:0}
  .matrow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 4px}
  .matopt{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:9px;padding:6px 10px;cursor:pointer;transition:.12s}
  .matopt:hover{color:#fff}
  .matopt.on{border-color:var(--accent);color:#fff}
  .matsw{width:16px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
  .mat-sw-black{background:#000}
  .mat-sw-darkglass{background:rgba(40,44,48,.85);backdrop-filter:blur(2px)}
  .mat-sw-lightglass{background:rgba(255,255,255,.55)}
  .mat-sw-vibrant{background:linear-gradient(135deg,rgba(120,90,255,.6),rgba(52,214,192,.6))}
  .accrow{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 6px}
  .accdot{width:24px;height:24px;border-radius:50%;cursor:pointer;transition:transform .14s;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.3)}
  .accdot:hover{transform:scale(1.12)}
  .accdot.on{box-shadow:0 0 0 2px #161719,0 0 0 4px #fff}
  .setsec{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--t3);margin:12px 0 4px}
  .setsec:first-child{margin-top:0}
  .setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--hair)}
  .setl{flex:1;min-width:0}
  .setname{font-size:13px;color:#fff;font-weight:600}
  .setsub{font-size:10px;color:var(--t3);margin-top:2px}
  .setstat{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:6px}
  .sdot{width:7px;height:7px;border-radius:50%}.sdot.ok{background:var(--green)}
  .setgo{font-size:11px;color:var(--accent);cursor:pointer;font-weight:600}
  .setval{font-size:11px;color:var(--t2);cursor:pointer}
  .sw{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;flex:none;transition:background .18s}
  .sw.on{background:var(--accent)}
  .sw .swk{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s cubic-bezier(.32,.72,0,1)}
  .sw.on .swk{left:18px}

  .view{flex:1;min-height:0;overflow:hidden;padding:14px 16px}
  .dock{display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 6px 9px}
  .dk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);cursor:pointer;position:relative;background:#1a1a1c;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:.12s}
  .dk:hover{background:#252527;color:#fff}
  .dk.on{background:#2c2c2e;color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .dk .bdg{position:absolute;top:0;right:1px;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px #000}
  .vh{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--t3);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}

  /* ===== Dev category (vertical paging + small centered rail) ===== */
  .devwrap{display:flex;gap:6px;height:100%}
  .devstage{flex:1;min-width:0;position:relative;overflow:hidden}
  .devpage{height:100%;overflow-y:auto}
  .devpage::-webkit-scrollbar,.clip::-webkit-scrollbar{width:0}
  /* 子分类导轨:极简竖向分页点 */
  .devrail{flex:none;width:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px}
  .dri{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:height .26s cubic-bezier(.32,.72,0,1),background .24s,border-radius .24s}
  .dri:hover{background:rgba(255,255,255,.5)}
  .dri.on{height:18px;border-radius:3px;background:var(--accent)}

  /* ===== Dashboard bento ===== */
  .bento{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:100%}
  .card{background:rgba(255,255,255,.04);border:.5px solid var(--hair);border-radius:14px;padding:11px 13px;overflow:hidden;cursor:pointer;transition:.12s}
  .card:hover{background:rgba(255,255,255,.07)}
  .card.media{grid-row:span 2;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
  .card.media .cov{position:absolute;inset:0;background:linear-gradient(135deg,#e8a07a,#b56a8f 55%,#6a4f8f);opacity:.5;filter:blur(2px)}
  .card.media .cov::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 70%)}
  .card.media .mc{position:relative;z-index:1}
  .ct{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--t3);margin-bottom:7px}
  .mt-title{font-size:15px;font-weight:700}.mt-artist{font-size:11px;color:rgba(255,255,255,.7)}
  .mini-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.25);position:relative;margin-top:8px}.mini-bar i{position:absolute;inset:0 58% 0 0;border-radius:2px;background:#fff}
  .dcal .day{font-size:20px;font-weight:800}.dcal .ev{font-size:10px;color:var(--t2);margin-top:5px;display:flex;gap:5px;align-items:center}.dcal .ev .d{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .dag .row{display:flex;align-items:center;gap:6px;font-size:10px;margin-top:5px}.dag .row .pd{width:6px;height:6px;border-radius:50%;background:var(--green)}

  /* ===== Dashboard (MacNotch-style widget row) ===== */
  .dashrow{display:flex;height:100%;align-items:stretch}
  .dwid{flex:1;padding:2px 16px;border-right:1px solid var(--hair);min-width:0;display:flex;flex-direction:column}
  .dwid:first-child{padding-left:2px}.dwid:last-child{border-right:none;padding-right:2px}
  .dwh{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--t3);margin-bottom:12px;white-space:nowrap}
  .tgs{display:flex;gap:7px;flex-wrap:wrap}
  .tg2{width:40px;height:40px;border-radius:12px;background:var(--tile2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);cursor:pointer}
  .tg2.on{background:#3a3a3d;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .todayrow{display:flex;gap:13px;align-items:center}
  .donut2{width:54px;height:54px;border-radius:50%;flex:none;position:relative;background:conic-gradient(var(--accent) 27%,rgba(255,255,255,.12) 0)}
  .donut2::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#000}
  .donut2 span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1}
  .tlist{font-size:11px;display:flex;flex-direction:column;gap:6px}
  .tlist .tr{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--t2)}.tlist .tr .d{width:6px;height:6px;border-radius:50%;flex:none}
  .npm{display:flex;gap:10px;align-items:center}
  .npcov{width:44px;height:44px;border-radius:9px;background:linear-gradient(135deg,#1db954,#0a7f3a);flex:none}
  .npt{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.npa{font-size:10px;color:var(--t2)}
  .npbar{height:3px;border-radius:2px;background:rgba(255,255,255,.2);position:relative;margin-top:8px}.npbar i{position:absolute;inset:0 56% 0 0;background:var(--accent);border-radius:2px}
  .agr{display:flex;align-items:center;gap:7px;font-size:11px;margin-top:7px}
  .agr .pd{width:7px;height:7px;border-radius:50%;flex:none}
  /* media-left bigger + single-row toggles */
  .dwid.wmedia{flex:1.6}.dwid.wquick{flex:.8}
  .npbig{display:flex;gap:12px;align-items:center}
  .npcov2{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#1db954,#0a7f3a);flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .npmeta{min-width:0;flex:1}
  .npctrl{display:flex;gap:16px;font-size:13px;margin-top:9px;color:#fff}.npctrl span{cursor:pointer}
  .tgs1{display:flex;gap:7px}
  .tg1{width:34px;height:34px;border-radius:11px;background:var(--tile2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);cursor:pointer}
  .tg1.on{background:#3a3a3d;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

  /* capture attachments */
  .attrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .attchip{position:relative;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:.5px solid var(--hair);border-radius:10px;padding:5px 10px 5px 5px;max-width:180px}
  .attchip .x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .attchip .ath{width:26px;height:26px;border-radius:6px;background-size:cover;flex:none}
  .attchip .abadge{width:26px;height:26px;border-radius:6px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--t2);flex:none}
  .attchip .anm{font-size:11px;color:#e6e6ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ===== Stats 数据看板 ===== */
  .stats{display:flex;gap:18px;height:100%}
  .stcol.heat{flex:1.45;min-width:0;display:flex;flex-direction:column}
  .hmap{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;flex:1;margin-top:4px;min-height:0}
  .hmap i,.hleg i{background:var(--accent);border-radius:2px}
  .l0{opacity:.09}.l1{opacity:.3}.l2{opacity:.52}.l3{opacity:.74}.l4{opacity:1}
  .hleg{font-size:9px;color:var(--t3);display:flex;align-items:center;gap:3px;margin-top:8px}.hleg i{width:9px;height:9px}
  .stcol.tiles{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .sttile{background:rgba(255,255,255,.04);border:.5px solid var(--hair);border-radius:12px;padding:10px 13px}
  .sl{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--t3)}
  .sv{font-size:24px;font-weight:800;margin-top:3px}.sv small{font-size:13px;color:var(--t2)}
  .spark{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:8px}.spark i{flex:1;border-radius:2px;background:var(--accent);opacity:.85}
  .sttile2{display:flex;gap:10px}
  .mini{flex:1;background:rgba(255,255,255,.04);border:.5px solid var(--hair);border-radius:12px;padding:10px 12px}
  .sv2{font-size:18px;font-weight:800;margin-top:4px}.sv2 small{font-size:11px;color:var(--t2);font-weight:600}

  /* ===== Media full ===== */
  .mfull{position:relative;height:100%;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;padding:9px 16px 9px}
  .mtop{position:relative;z-index:1;display:flex;align-items:center;margin-bottom:3px}
  .mback{font-size:12px;color:var(--t2);font-weight:600;cursor:pointer}
  .msrc{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--t2);background:rgba(255,255,255,.08);border-radius:8px;padding:4px 10px;cursor:pointer}
  .msrc:hover{background:rgba(255,255,255,.16);color:#fff}

  .pgo2{font-size:13px;color:var(--accent);cursor:pointer;flex:none}
  .mfull .bgcov{position:absolute;inset:0;background:linear-gradient(135deg,#e8a07a,#b56a8f 55%,#6a4f8f);filter:blur(34px) saturate(1.4);transform:scale(1.3);opacity:.6}

  /* media waveform visualizer (monochrome, daily --accent) */
  .mwave{position:relative;z-index:1;display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:7px;
    -webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}

  /* ===== Calendar reminder banner ===== */
  .rmd{display:flex;align-items:center;gap:17px;height:100%;padding:4px 22px}

  .rmd-top{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--t2);display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .rmd-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
  .rmd-t{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmd-meta{font-size:12px;color:var(--t2);margin-top:3px;font-variant-numeric:tabular-nums}

  .rmd-b:hover{background:rgba(255,255,255,.16);color:#fff}

  /* ===== Capture ===== */
  .cap{display:flex;flex-direction:column;height:100%}

  .chip{font-size:12px;color:var(--t2);background:rgba(255,255,255,.07);border-radius:18px;padding:5px 14px;cursor:pointer}
  .chip.on{background:var(--accent);color:#1a1208;font-weight:600}
  .capin{background:rgba(255,255,255,.06);border-radius:12px;padding:11px 14px;font-size:14px;flex:none;min-height:22px;max-height:120px;overflow-y:auto;cursor:text;outline:none;line-height:1.5}
  .capin.on{box-shadow:0 0 0 1.5px rgba(255,197,61,.5)}.capin .ph{color:var(--t3)}
  .caret{display:inline-block;width:2px;height:16px;background:var(--accent);vertical-align:-3px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
  .caprow{display:flex;align-items:center;margin-top:10px}.caprow .hintc{font-size:10px;color:var(--t3)}.caprow .sendb{margin-left:auto;background:var(--accent);color:#1a1208;font-weight:600;font-size:12px;border-radius:9px;padding:7px 16px;cursor:pointer}
  .recent{margin-top:12px;overflow-y:auto;flex:1;min-height:0}

  .recent .r{display:flex;gap:8px;align-items:center;font-size:12px;padding:6px 0;border-bottom:.5px solid var(--hair)}
  .recent .r .k{font-size:9px;color:#1a1208;background:var(--accent);border-radius:5px;padding:1px 6px;font-weight:700;flex:none}
  .recent .r .x{font-size:11px;color:var(--t2)}.recent .r .tm{margin-left:auto;color:var(--t3);font-size:10px}

  /* ===== Calendar (week strip ⇄ month grid + agenda) ===== */
  .calview{display:flex;flex-direction:column;height:100%}
  .calbody{flex:1;min-height:0;display:flex;gap:14px}
  .calL{flex:1.05;min-width:0;display:flex;flex-direction:column}
  .calR{flex:1;min-width:0;display:flex;flex-direction:column;border-left:.5px solid var(--hair);padding-left:14px}
  /* header */
  .calhd2{display:flex;align-items:center;gap:7px;margin-bottom:11px}
  .calhd2 .cm{font-size:17px;font-weight:800}
  .calhd2 .cy{font-size:12px;color:var(--t3);font-weight:600}
  .calhd2 .sp{margin-left:auto}
  .cpill{font-size:10px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.08);border-radius:8px;padding:4px 9px;cursor:pointer;margin-left:4px}
  .cseg{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:9px;padding:2px}
  .cseg span{width:25px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;transition:.12s}
  .cseg span:hover{color:#fff}
  .cseg span.on{background:var(--accent);color:#1a1208}
  .cnav{display:flex;gap:5px}
  .cnav span{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);cursor:pointer}
  .cnav span:hover,.cpill:hover{background:rgba(255,255,255,.16);color:#fff}
  /* week strip */
  .wstrip{flex:1;display:flex;align-items:center;gap:12px}
  .wbig{flex:none}
  .wbig .wm{font-size:30px;font-weight:800;line-height:.95}
  .wbig .wy{font-size:12px;color:var(--t3);font-weight:600;margin-top:3px}
  .wdays{flex:1;display:flex;gap:4px}
  .wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 13px;border-radius:13px;cursor:pointer;position:relative}

  .wcol .wl{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--t3)}

  .wcol .wnum{font-size:21px;font-weight:800;color:#fff}

  .wcol.tod{background:rgba(255,255,255,.06)}

  /* month grid */
  .mgrid{flex:1;display:flex;flex-direction:column;min-height:0}

  .mgh span{font-size:9px;font-weight:700;letter-spacing:.3px;color:var(--t3);text-align:center}
  .mgb{flex:1;display:grid;grid-template-columns:30px repeat(7,1fr);grid-auto-rows:1fr;min-height:0}
  .mrail{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-right:4px}
  .mrail .rm{font-size:8px;font-weight:700;letter-spacing:.4px;color:var(--t3);line-height:1.1}
  .mrail .rn{font-size:16px;font-weight:800;color:var(--t2);line-height:1}
  .mrail.cur .rm,.mrail.cur .rn{color:var(--accent)}
  .mrail .rd{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
  .mcell{display:flex;align-items:center;justify-content:center;position:relative;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.86);cursor:pointer}
  .mcell>span{position:relative;z-index:1}
  .mcell.out>span{color:var(--t3);opacity:.45}
  .mcell.tod{font-weight:800;color:#0c0f12}
  .mcell.tod::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff}
  .mcell .mev{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);z-index:1}
  /* agenda */
  .agenda{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .agenda::-webkit-scrollbar{width:0}
  .aghd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .aghd .agd{font-size:13px;font-weight:800;color:#fff}
  .aghd .agn{font-size:10px;color:var(--t3)}
  .evk{color:var(--t3)}
  .evgo{align-self:center;font-size:10px;color:var(--accent);opacity:0;transition:opacity .12s;white-space:nowrap;margin-right:8px}
  .evr{cursor:pointer}
  .evr:hover{background:rgba(255,255,255,.03);border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px}
  .evr:hover .evgo{opacity:1}
  .agempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;flex:1;color:var(--t3);font-size:12px}
  .agempty span{color:var(--accent);cursor:pointer}
  .mcell.sel:not(.tod){color:#fff}
  .mcell.sel:not(.tod)::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--accent)}
  .wcol.sel:not(.tod){box-shadow:inset 0 0 0 1.5px var(--accent)}
  .evr{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:.5px solid var(--hair)}
  .evr:last-child{border-bottom:none}
  .evtime{flex:none;width:44px}
  .evtime .s{font-size:13px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
  .evtime .e{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
  .evbody{flex:1;min-width:0}
  .evbody .nm{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evbody .lo{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evbody .lo svg{flex:none;color:var(--t3)}
  .evbody .lo span{overflow:hidden;text-overflow:ellipsis}
  .evdot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px}

  /* ===== Focus (并入速记) + 任务目标 ===== */
  .ttog{display:inline-flex;border:.5px solid var(--hair);border-radius:8px;overflow:hidden;margin-bottom:11px}
  .ttog span{font-size:11px;color:var(--t2);padding:5px 12px;cursor:pointer;transition:.12s}
  .ttog span.on{background:var(--accent);color:#1a1208;font-weight:600}
  .focusrun{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;flex:1;min-height:150px;padding:8px 0}
  .focusrun .lab{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--t3)}
  .focusrun .ft{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;display:flex;align-items:center;gap:11px;color:#fff}
  .focusrun .ft .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:fpulse 1.1s ease-in-out infinite}
  .focusrun .what{font-size:13px;color:#fff;font-weight:600;max-width:88%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fstop{background:var(--accent);color:#1a1208;font-weight:600;font-size:12px;border-radius:9px;padding:8px 22px;cursor:pointer;margin-top:2px}
  .bfocus{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .bfocus .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:fpulse 1.1s ease-in-out infinite}
  @keyframes fpulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  /* 速记:TAB 提示 + 附件(时间/地点)chip */
  .vh .tabh{font-size:9px;font-weight:600;color:var(--t3);letter-spacing:.3px}
  .attr2{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .achip{display:inline-flex;align-items:center;gap:6px;background:#2a2a2c;border-radius:999px;padding:5px 9px 5px 11px;font-size:11px;color:#fff;font-variant-numeric:tabular-nums}

  .achip .ax{color:var(--t3);cursor:pointer;font-size:13px;line-height:1;padding-left:1px}
  .achip .ax:hover{color:#fff}
  .aadd{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:.5px solid var(--hair);border-radius:999px;padding:5px 12px;font-size:11px;color:var(--t2);cursor:pointer;transition:.12s}
  .aadd:hover{color:#fff;border-color:rgba(255,255,255,.25)}
  .aadd .ai{display:inline-flex;align-items:center;color:var(--t3)}
  .ahint{font-size:10px;color:var(--t3);margin-left:2px}
  .sendb{display:inline-flex;align-items:center;gap:5px;flex:none}
  .capatt{display:flex;gap:7px;align-items:center;min-width:0;flex:1;overflow:hidden}
  /* 最近:横向滑动卡片条 */
  .recents{margin-top:12px;flex:none}
  .rectog{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--t3);cursor:pointer;padding:3px 0}
  .rectog:hover{color:#fff}
  .rrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:8px}
  .rrow::-webkit-scrollbar{height:0}
  .rcard{flex:none;width:160px;background:rgba(255,255,255,.04);border:.5px solid var(--hair);border-radius:11px;padding:8px 11px;cursor:pointer;transition:.12s}
  .rcard:hover{background:rgba(255,255,255,.07)}
  .rcard .k{font-size:9px;color:#1a1208;background:var(--accent);border-radius:5px;padding:1px 6px;font-weight:700}
  .rcard .rx{font-size:11px;color:#e6e6ea;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard .rtm{font-size:9px;color:var(--t3);margin-top:3px}

  /* ===== Files / Shelf ===== */
  .files{display:flex;flex-direction:column;height:100%}
  .dropzone{flex:1;border:1.5px dashed #5a5a5e;border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;overflow-y:auto;transition:.15s}

  .ftile .x{position:absolute;top:-5px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;cursor:pointer}
  .ftile:hover .x{display:flex}
  .ftile .nm{font-size:10px;color:#cfcfd2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .factions{display:flex;gap:8px;margin-top:10px}
  .fbtn{flex:1;text-align:center;font-size:11px;font-weight:600;border-radius:9px;padding:8px;cursor:pointer}
  .fbtn.up{background:var(--accent);color:#1a1208}.fbtn.ck{background:rgba(10,132,255,.18);color:#7fb8ff;border:1px solid rgba(10,132,255,.4)}

  /* ===== Agents ===== */
  .srow{display:flex;align-items:center;gap:9px;font-size:12px;padding:8px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}
  .srow:hover{background:rgba(255,255,255,.05)}
  .pd{width:8px;height:8px;border-radius:50%;flex:none}.pd.run{background:var(--green)}.pd.wait{background:var(--orange)}.pd.done{background:rgba(255,255,255,.4)}

  .shine{background:linear-gradient(90deg,rgba(255,255,255,.3),#fff 20%,var(--accent) 50%,#fff 80%,rgba(255,255,255,.3));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.7s linear infinite}@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
  .stag{margin-left:auto;font-size:10px;color:var(--t3)}.stag.w{color:var(--orange);font-weight:600}

const _rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const _hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const _lin=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
const _lum=([r,g,b])=>.2126*_lin(r)+.7152*_lin(g)+.0722*_lin(b);
const _contrast=(a,b)=>{const L1=_lum(a),L2=_lum(b);const hi=Math.max(L1,L2)+.05,lo=Math.min(L1,L2)+.05;return hi/lo;};
// 随机一套:背景+主题,确保 accent 与背景观感对比 ≥ 3:1(看得清)
function randomTheme(){
  const mats=Object.keys(MATS);
  const m=mats[Math.floor(Math.random()*mats.length)];
  const bg=MATS[m].rep, bgLight=_lum(bg)>.4;
  // 随机挑一个 palette 色,再按背景深浅调亮/调暗,直到对比 ≥ 3.2:1(看得清)
  let rgb=_rgb(palette[Math.floor(Math.random()*palette.length)]),tries=0;
  while(_contrast(rgb,bg)<3.2&&tries<8){rgb=bgLight?rgb.map(v=>v*0.55):rgb.map(v=>Math.min(255,v*1.2+28));tries++;}
  const c=_contrast(rgb,bg);
  applyMat(m);applyAccent(_hex(rgb));
  openSettings();
  flash('随机:'+MATS[m].l+' + 主题色 · 对比 '+c.toFixed(1)+':1');
}

  cal:()=>{

    const same=(a,b)=>a.toDateString()===b.toDateString();
    const moff=d=>(d.getDay()+6)%7;  // 周一=0
    let left;
    if(S.calExpand){  // 月网格 + 左侧月份导轨
      const start=new Date(Y,M,1);start.setDate(1-moff(start));
      let body='',prevMon=-1;
      for(let r=0;r<6;r++){
        const rs=new Date(start);rs.setDate(start.getDate()+r*7);
        const rmon=rs.getMonth(),show=rmon!==prevMon,cur=rmon===M;prevMon=rmon;
        body+= show
          ? `<div class="mrail${cur?' cur':''}"><span class="rm">${new Date(rs.getFullYear(),rmon,1).toLocaleString('en',{month:'short'}).toUpperCase()}</span><span class="rn">${String(rmon+1).padStart(2,'0')}</span>${cur?'<span class="rd"></span>':''}</div>`
          : `<div class="mrail"></div>`;
        for(let i=0;i<7;i++){const d=new Date(rs);d.setDate(rs.getDate()+i);
          const out=d.getMonth()!==M,tod=same(d,t),has=!out&&CAL_EVDAYS.includes(d.getDate());
          const sel=!out&&d.getDate()===S.calSel;
          body+=`<div class="mcell${out?' out':''}${tod?' tod':''}${sel?' sel':''}" data-act="calpick"${out?'':` data-day="${d.getDate()}"`}><span>${d.getDate()}</span>${has?'<span class="mev"></span>':''}</div>`;}
      }
      left=`<div class="mgrid"><div class="mgh"><span></span>${WLh.map(w=>`<span>${w}</span>`).join('')}</div><div class="mgb">${body}</div></div>`;
    }else{  // 周条(周一开头)
      const base=off===0?new Date(t):new Date(Y,M,1);const ws=new Date(base);ws.setDate(base.getDate()-moff(base));let cols='';
      for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);
        const tod=same(d,t),has=d.getMonth()===M&&CAL_EVDAYS.includes(d.getDate());
        const wsel=d.getMonth()===M&&d.getDate()===S.calSel;

      left=`<div class="wstrip"><div class="wbig"><div class="wm">${mname.slice(0,3)}</div><div class="wy">${Y}</div></div><div class="wdays">${cols}</div></div>`;
    }
    const items=CAL_ITEMS[S.calSel]||[];
    const isToday=S.calSel===t.getDate()&&off===0;
    const agenda=`<div class="aghd"><span class="agd">${isToday?'今天 · ':''}${M+1}月${S.calSel}日</span><span class="agn">${items.length?items.length+' 项':'无安排'}</span></div>`+

        : `<div class="agempty"><div>这天没有安排</div><span data-act="caledit" data-t="新建">＋ 到 Helm 新建</span></div>`);
    return `<div class="calview">
      <div class="calhd2"><span class="cm">${mname}</span><span class="cy">${Y}</span>
        ${off!==0?`<span class="cpill" data-act="caltoday">Today</span>`:''}

/* ---------- focus (并入速记;正向计时,关掉自动记录到 Helm) ---------- */
function startFocus(){S.focusOn=true;S.focusWhat=(S.captext||'').trim()||'专注';S.focusSec=0;S.captext='';S.capLock=false;flash('开始专注 · '+S.focusWhat);}
function stopFocus(){const mins=Math.max(1,Math.round(S.focusSec/60));RECENT.unshift({k:'专注',x:S.focusWhat+' · '+mins+'m',tm:'now'});flash('已记录 Helm /api/focus · 专注 '+mins+' 分钟');S.focusOn=false;S.focusWhat='';S.focusSec=0;}

/* ---------- events ---------- */
notch.addEventListener('mouseenter',()=>{if(!S.open){S.open=true;render();}});
notch.addEventListener('mouseleave',()=>{if(S.mode==='waiting')return;if(S.open&&!S.capLock){S.open=false;render();}});
dock.addEventListener('click',e=>{const d=e.target.closest('.dk');if(d){S.view=d.dataset.mod;S.mediaLyrics=false;if(S.view==='dev')S.devSec=0;render();}});
view.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]'))return;  // 媒体上一首/下一首:不触发进模块
  const rm=e.target.closest('[data-rm]');if(rm){S.files.splice(+rm.dataset.rm,1);render();return;}
  const k=e.target.closest('[data-k]');if(k){S.kind=k.dataset.k;render();return;}
  const tt=e.target.closest('[data-tt]');if(tt){S.taskTo=tt.dataset.tt;render();return;}
  const act=e.target.closest('[data-act]');
  const go=e.target.closest('[data-go]');
  if(!act){if(go){const g=go.dataset.go;if(g==='media-flip'){S.mediaLyrics=!S.mediaLyrics;render();}else{zoomTo(g);}}return;}
  const a=act.dataset.act;
  if(a==='focus'){S.capLock=true;}
  else if(a==='fstart'){startFocus();}
  else if(a==='fstop'){stopFocus();}
  else if(a==='rectog'){S.showRecent=!S.showRecent;}
  else if(a==='addwhen'){S.capWhen='今天 15:00';}
  else if(a==='addwhere'){S.capWhere='Brooklyn, New York';}
  else if(a==='rmwhen'){S.capWhen=null;S.capDay=null;}
  else if(a==='rmwhere'){S.capWhere=null;}
  else if(a==='calpick'){if(act.dataset.day)S.calSel=+act.dataset.day;}
  else if(a==='caledit'){flash('在 Helm 打开编辑 · '+(act.dataset.t||'')+' · /api/calendar');}
  else if(a==='send'){
    const ext=(S.capWhen?' · '+S.capWhen:'')+(S.capWhere?' · '+S.capWhere:'');
    if(S.capDay&&!CAL_EVDAYS.includes(S.capDay))CAL_EVDAYS.push(S.capDay);
    const onCal=S.capDay?' · 已上日历':'';
    if(S.files.length){flash('已把 '+S.files.length+' 个文件 + 备注发给 Helm 归档(Journal / RAG)');S.files=[];}
    else if(S.kind==='task'){flash((S.taskTo==='agent'?'已派给 agent · /api/agent/tasks → Cockpit':'已加任务 · /api/tasks')+onCal+ext);}
    else if(S.kind==='ask'){flash('已问 Helm 大脑');}
    else if(S.kind==='journal'){flash('已记日记 · /api/notes');}
    else flash('已记录 · /api/notes'+onCal+ext);
    S.captext='';S.capLock=false;S.capWhen=null;S.capWhere=null;S.capDay=null;}
  else if(a==='pp'){S.play=S.play?0:1;}
  else if(a==='resolve'){S.mode='running';S.open=false;S.view='dash';}
  else if(a==='addev'){flash('（演示）打开「加事件」表单');}
  else if(a==='calmonth'){S.calExpand=true;}
  else if(a==='calweek'){S.calExpand=false;}
  else if(a==='caltoday'){S.calOff=0;}
  else if(a==='calprev'){S.calOff=(S.calOff||0)-1;}
  else if(a==='calnext'){S.calOff=(S.calOff||0)+1;}
  else if(a==='srccycle'){S.mediaSrc=(S.mediaSrc+1)%SOURCES.length;flash('已切换播放源 · '+SOURCES[S.mediaSrc]);}
  else if(a==='rmdjoin'){flash('已加入 · '+S.remind.t);S.remind=null;}
  else if(a==='rmdsnooze'){flash('已稍后提醒(5 分钟)');S.remind=null;}
  else if(a==='rmddismiss'){S.remind=null;}
  render();
});
// 全局左右滑动 → 切换模块(触控板横扫 / 鼠标拖拽),带方向性滑入动画
let animating=false;
function switchModule(dir){
  if(!S.open||S.mode==='waiting'||animating)return;
  const ids=MODULES.map(m=>m.id);let i=ids.indexOf(S.view);if(i<0)i=0;
  const next=ids[(i+dir+ids.length)%ids.length];
  if(next===S.view)return;
  slideTo(next,dir);
}
function slideTo(next,dir){
  animating=true;
  // 旧内容朝滑动方向退出
  view.style.transition='transform .17s ease,opacity .17s ease';
  view.style.transform=`translateX(${dir>0?-46:46}px)`;view.style.opacity='0';
  setTimeout(()=>{
    S.view=next;S.mediaLyrics=false;if(next==='dev')S.devSec=0;render();
    // 新内容从反方向无动画就位,再滑入归零
    view.style.transition='none';
    view.style.transform=`translateX(${dir>0?46:-46}px)`;view.style.opacity='0';
    void view.offsetWidth;  // 强制重排,使下一段 transition 生效
    view.style.transition='transform .3s cubic-bezier(.32,.72,0,1),opacity .26s ease';
    view.style.transform='translateX(0)';view.style.opacity='1';
    setTimeout(()=>{animating=false;view.style.transition='';},310);
  },170);
}
// data-go 钻入式过渡(放大):dash↔media / dash↔dev 等,比直接 render 丝滑
function zoomTo(next){
  if(next===S.view){render();return;}
  if(animating){S.view=next;S.mediaLyrics=false;if(next==='dev')S.devSec=0;render();return;}
  animating=true;
  view.style.transition='transform .16s ease,opacity .16s ease';
  view.style.transform='scale(.97)';view.style.opacity='0';
  setTimeout(()=>{
    S.view=next;S.mediaLyrics=false;if(next==='dev')S.devSec=0;render();
    view.style.transition='none';view.style.transform='scale(.955)';view.style.opacity='0';
    void view.offsetWidth;
    view.style.transition='transform .34s cubic-bezier(.32,.72,0,1),opacity .26s ease';
    view.style.transform='scale(1)';view.style.opacity='1';
    setTimeout(()=>{animating=false;view.style.transition='';},340);
  },160);
}
notch.addEventListener('wheel',e=>{
  if(!S.open||S.mode==='waiting')return;
  const ax=Math.abs(e.deltaX),ay=Math.abs(e.deltaY);
  // Dev 页:纵扫切子分类(上下分页);其余:横扫切模块
  if(S.view==='dev'&&ay>ax&&ay>10){e.preventDefault();switchDev(e.deltaY>0?1:-1);return;}
  if(ax>ay&&ax>10){e.preventDefault();switchModule(e.deltaX>0?1:-1);}
},{passive:false});
let dragX=null,dragY=null;
notch.addEventListener('pointerdown',e=>{if(S.capLock||e.target.closest('.dk,[data-act],[data-go],[data-stop],[data-k],.dri'))return;dragX=e.clientX;dragY=e.clientY;});
notch.addEventListener('pointerup',e=>{if(dragX==null)return;const dx=e.clientX-dragX,dy=e.clientY-dragY;dragX=dragY=null;
  if(S.view==='dev'&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>45){switchDev(dy<0?1:-1);return;}
  if(Math.abs(dx)>55)switchModule(dx<0?1:-1);});
document.addEventListener('keydown',e=>{
  if(S.mode==='waiting'){const k=e.key.toLowerCase();if(k==='y'||k==='n'){S.mode='running';S.open=false;S.view='dash';render();}return;}
  if(e.key==='Tab'&&S.open&&S.view==='cap'&&!S.focusOn){e.preventDefault();const ks=['note','journal','task','focus','ask'];S.kind=ks[(ks.indexOf(S.kind)+(e.shiftKey?-1:1)+ks.length)%ks.length];render();return;}
  if(!S.capLock)return;
  if(e.key==='Enter'){if(S.kind==='focus'&&!S.focusOn){startFocus();render();return;}S.captext='';S.capLock=false;render();return;}
  if(e.key==='Escape'){S.captext='';S.capLock=false;render();return;}
  if(e.key==='Backspace'){S.captext=S.captext.slice(0,-1);render();e.preventDefault();return;}
  if(e.key.length===1){S.captext+=e.key;render();}
});

/* ---------- Dev sub-category vertical paging ---------- */
function bindDev(){
  const rail=document.getElementById('devrail');if(!rail)return;
  rail.addEventListener('click',e=>{const d=e.target.closest('.dri');if(!d)return;
    const t=+d.dataset.sec;if(t!==S.devSec)slideDev(t,t>S.devSec?1:-1);});
}
function switchDev(dir){  // 上下分页:不循环,到顶/底停住
  if(animating)return;const n=DEVSECS.length;const next=S.devSec+dir;
  if(next<0||next>=n)return;slideDev(next,dir);
}
function slideDev(next,dir){
  const page=document.getElementById('devpage');if(!page||animating)return;
  animating=true;
  page.style.transition='transform .16s ease,opacity .16s ease';
  page.style.transform=`translateY(${dir>0?-34:34}px)`;page.style.opacity='0';
  notch.style.setProperty('--eh',(DEVSECS[next].h+NTOP)+'px');  // 高度同步过渡(含顶栏)
  setTimeout(()=>{
    S.devSec=next;page.innerHTML=devPage(next);
    document.querySelectorAll('#devrail .dri').forEach((it,i)=>it.classList.toggle('on',i===next));
    page.style.transition='none';
    page.style.transform=`translateY(${dir>0?34:-34}px)`;page.style.opacity='0';
    void page.offsetWidth;
    page.style.transition='transform .3s cubic-bezier(.32,.72,0,1),opacity .26s ease';
    page.style.transform='translateY(0)';page.style.opacity='1';
    setTimeout(()=>{animating=false;page.style.transition='';},310);
  },160);
}

/* ---------- real file drag-drop ---------- */
function bindDropzone(){
  const dz=document.getElementById('dz');if(!dz)return;
  dz.addEventListener('dragover',ev=>{ev.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',ev=>{ev.preventDefault();dz.classList.remove('over');addFiles(ev.dataTransfer.files);});
}
// also accept drops anywhere on the notch (auto-switch to Files)
['dragover','drop','dragenter','dragleave'].forEach(t=>notch.addEventListener(t,e=>e.preventDefault()));
notch.addEventListener('dragenter',()=>{notch.classList.add('drag');if(!S.open){S.open=true;}S.view='cap';render();});
notch.addEventListener('dragleave',e=>{if(!notch.contains(e.relatedTarget))notch.classList.remove('drag');});
notch.addEventListener('drop',e=>{notch.classList.remove('drag');S.open=true;S.view='cap';addFiles(e.dataTransfer.files);});
function addFiles(list){
  [...list].forEach(f=>{const ext=(f.name.split('.').pop()||'FILE').toUpperCase().slice(0,4);
    const it={name:f.name,ext,url:null};
    if(f.type&&f.type.startsWith('image/'))it.url=URL.createObjectURL(f);
    S.files.push(it);});
  S.view='cap';if(S.kind==='focus')S.kind='note';render();
}

/* ---------- timers ---------- */
setInterval(()=>{ // focus 正向计时(关掉时记录)
  if(S.focusOn){S.focusSec++;if(S.open&&S.view==='cap'&&S.kind==='focus')render();else renderBar();}
},1000);
setInterval(()=>{ // lyrics advance
  if(S.view==='media'&&S.play){lyricI=(lyricI+1)%LYRICS.length;render();}
},2600);

let flashEl;
function flash(msg){clearTimeout(flashEl);let f=document.getElementById('flash');if(!f){f=document.createElement('div');f.id='flash';
  f.style.cssText='position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.85);color:#fff;font-size:12px;padding:9px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)';document.body.appendChild(f);}
  f.textContent=msg;f.style.opacity='1';flashEl=setTimeout(()=>f.style.opacity='0',1800);}

document.querySelectorAll('#ctl-mode .opt').forEach(o=>o.onclick=()=>{S.mode=o.dataset.mode;render();});
document.querySelectorAll('#ctl-play .opt').forEach(o=>o.onclick=()=>{S.play=+o.dataset.play;render();});
document.querySelectorAll('#ctl-remind .opt').forEach(o=>o.onclick=()=>{S.remind=o.dataset.remind==='1'?REMINDER:null;render();});
if(S.cfg.dailytheme)dailyRandTheme();  // 开了「每天随机一套」就按当天种子应用
S.open=true;render();
</script>
