<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helm Notch — 可交互原型</title>
<style>
  :root{
    --accent:#FFC53D;
    --green:#34C759;--orange:#FF9F0A;--cyan:#34D6C0;--blue:#0A84FF;--red:#FF453A;
    --t1:#fff;--t2:rgba(255,255,255,.56);--t3:rgba(255,255,255,.34);--hair:rgba(255,255,255,.09);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0b10;min-height:100vh;color:var(--t1);overflow-x:hidden}
  .desk{position:relative;min-height:100vh;
    background:linear-gradient(135deg,#3a2f52,#1c2840 50%,#0e1a22),radial-gradient(900px 500px at 70% 30%,rgba(255,180,120,.18),transparent)}
  .menubar{position:fixed;top:0;left:0;right:0;height:30px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 16px;font-size:12px;color:rgba(255,255,255,.7);z-index:5}
  .menubar .l{position:absolute;left:14px;font-weight:600}
  .hint{position:fixed;bottom:96px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.4);line-height:1.7}

  /* ===== Notch ===== */
  #notch{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:10;
    background:#000;color:#fff;overflow:hidden;
    width:var(--cw);height:30px;border-radius:0 0 16px 16px;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
    transition:width .5s cubic-bezier(.32,.72,0,1),height .5s cubic-bezier(.32,.72,0,1),border-radius .4s ease;
    --cw:340px;--ew:600px;--eh:300px}
  #notch.open{width:var(--ew);height:var(--eh);border-radius:0 0 24px 24px}
  #notch.banner{width:560px;height:var(--bh,250px);border-radius:0 0 26px 26px}
  #notch::before,#notch::after{content:"";position:absolute;top:0;width:12px;height:12px;background:#000;pointer-events:none}
  #notch::before{left:-12px;-webkit-mask:radial-gradient(12px at 0 12px,transparent 98%,#000);mask:radial-gradient(12px at 0 12px,transparent 98%,#000)}
  #notch::after{right:-12px;-webkit-mask:radial-gradient(12px at 12px 12px,transparent 98%,#000);mask:radial-gradient(12px at 12px 12px,transparent 98%,#000)}

  /* collapsed bar */
  #bar{position:absolute;top:0;left:0;right:0;height:30px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:opacity .14s ease;z-index:3}
  #notch.open #bar,#notch.banner #bar{opacity:0;pointer-events:none}
  .cleft{justify-self:end;display:flex;align-items:center;gap:7px;padding-right:14px}
  .ccam{width:170px;height:30px;position:relative}
  .ccam .lens{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#0c0c0c;box-shadow:inset 0 0 0 1px #2c2c2c}
  .cright{justify-self:start;display:flex;align-items:center;gap:6px;padding-left:14px}
  .mart{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,#e8a07a,#b56a8f 55%,#6a4f8f);flex:none}
  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
  .eq i{width:2px;border-radius:1px;background:var(--accent);animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.55s}.eq i:nth-child(4){animation-delay:-.15s}
  @keyframes eq{0%,100%{height:3px}50%{height:11px}}
  .cnp{font-size:10px;color:var(--t2);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars{display:inline-flex;align-items:center;gap:2.5px;height:13px}
  .bars i{width:2.5px;border-radius:1.5px;background:currentColor}
  .bars.run{color:var(--green)}.bars.run i{animation:wave .9s ease-in-out infinite}
  .bars.run i:nth-child(1){height:4px}.bars.run i:nth-child(2){height:6px;animation-delay:.15s}.bars.run i:nth-child(3){height:4px;animation-delay:.3s}
  @keyframes wave{0%,100%{height:4px}50%{height:12px}}
  .bars.wait{color:var(--orange)}.bars.wait i{height:10px;animation:wpulse 1.8s ease-in-out infinite}
  .bars.wait i:nth-child(2){height:0}.bars.wait i:nth-child(3){animation-delay:.9s}
  @keyframes wpulse{0%,100%{opacity:.55}50%{opacity:1}}
  .cct{font-size:11px;font-weight:700;color:#fff}
  .cdot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  /* 运行中:Claude ✻ loading */
  .cstar{color:var(--accent);font-size:12px;display:inline-block;animation:cspin 1.1s ease-in-out infinite}
  /* 没 session:右槽回退显示今日下一个日程 */
  .cev{font-size:10px;color:var(--t2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cev b{color:var(--accent);font-weight:700}

  /* expanded panel */
  #panel{position:absolute;inset:0;opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .42s cubic-bezier(.32,.72,0,1)}
  #notch.open #panel,#notch.banner #panel{opacity:1;transform:translateY(0);transition:opacity .34s ease .12s,transform .46s cubic-bezier(.32,.72,0,1) .1s}
  .gear{position:absolute;top:9px;right:12px;font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;z-index:6}
  .gear:hover{color:rgba(255,255,255,.8)}

  .quad{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:14px 9px 10px}
  .cell{padding:9px 11px;min-width:0;overflow:hidden}
  .cell.tl,.cell.tr{border-bottom:.5px solid var(--hair)}
  .cell.tl,.cell.bl{border-right:.5px solid var(--hair)}
  .ch{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--t3);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .ch .attn{color:var(--orange)}

  .art{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#e8a07a,#b56a8f 55%,#6a4f8f);flex:none;position:relative}
  .art::after{content:"";position:absolute;inset:-5px;border-radius:14px;background:inherit;filter:blur(12px);opacity:.45;z-index:-1}
  .title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .artist{font-size:11px;font-weight:600;color:var(--accent)}
  .pbar{height:4px;border-radius:2px;background:rgba(255,255,255,.16);position:relative;margin-top:7px}
  .pbar>i{position:absolute;inset:0 58% 0 0;border-radius:2px;background:var(--accent)}
  .times{display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-top:4px}
  .tp{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:7px;font-size:13px}
  .tp .b{cursor:pointer}.tp .big{font-size:18px}

  .week{display:flex;margin:5px 0}.day{flex:1;text-align:center;font-size:9px;color:var(--t3)}
  .day .n{font-size:12px;color:var(--t2);font-weight:600;display:block;margin-top:2px}
  .day.t .n{background:var(--accent);color:#0a0a0a;border-radius:50%;width:21px;height:21px;line-height:21px;margin:1px auto 0;font-weight:700}
  .ev{display:flex;gap:7px;margin-top:6px}.ev .tk{width:3px;border-radius:2px;background:var(--accent)}
  .ev .et{font-size:11px;font-weight:600}.ev .es{font-size:9px;color:var(--t3)}
  .muted{font-size:11px;color:var(--t3)}

  .srow{display:flex;align-items:center;gap:8px;font-size:11px;padding:5px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
  .srow:hover{background:rgba(255,255,255,.05)}
  .pdot{width:7px;height:7px;border-radius:50%;flex:none}
  .pdot.run{background:var(--green);animation:pd 1.9s ease-in-out infinite;--c:rgba(52,199,89,.7)}
  .pdot.wait{background:var(--orange);animation:pd 1.6s ease-in-out infinite;--c:rgba(255,159,10,.8)}
  .pdot.done{background:rgba(255,255,255,.4)}
  @keyframes pd{0%,100%{transform:scale(1);box-shadow:0 0 3px var(--c)}50%{transform:scale(1.18);box-shadow:0 0 8px var(--c)}}
  .snm{color:rgba(255,255,255,.86);font-weight:500;white-space:nowrap}
  .think{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;min-width:0}
  .think .st{color:var(--accent);font-size:12px;display:inline-block;animation:cspin 1.1s ease-in-out infinite}
  @keyframes cspin{0%{transform:rotate(0) scale(.85);opacity:.6}50%{transform:rotate(180deg) scale(1.12);opacity:1}100%{transform:rotate(360deg) scale(.85);opacity:.6}}
  .shine{background:linear-gradient(90deg,rgba(255,255,255,.3),#fff 20%,var(--accent) 50%,#fff 80%,rgba(255,255,255,.3));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.7s linear infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
  .scmd{font-size:10px;color:var(--t3);font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stag{font-size:9px;color:var(--t3);margin-left:auto;white-space:nowrap}
  .stag.w{color:var(--orange);font-weight:600}
  .chev{color:var(--t3);font-size:10px}
  .hookpill{display:flex;align-items:center;gap:8px;background:rgba(255,197,61,.14);border:1px solid rgba(255,197,61,.4);border-radius:10px;padding:9px 11px;cursor:pointer}
  .hookpill .tx{font-size:11px;font-weight:600;color:rgba(255,255,255,.85);flex:1}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:5px}
  .empty .bg{font-size:12px;font-weight:600;color:rgba(255,255,255,.42)}
  .empty .sm{font-size:10px;color:rgba(255,255,255,.26)}

  .chips{display:flex;gap:6px;margin-bottom:8px}
  .chip{font-size:11px;color:var(--t2);background:rgba(255,255,255,.07);border-radius:18px;padding:3px 11px;cursor:pointer}
  .chip.on{background:var(--accent);color:#1a1208;font-weight:600}
  .capwrap{display:flex;gap:8px;align-items:center}
  .field{flex:1;background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--t3);min-height:36px;cursor:text;outline:none}
  .field.on{background:rgba(255,255,255,.1);box-shadow:0 0 0 1px rgba(255,197,61,.5);color:#fff}
  .field .ph{color:var(--t3)}
  .caret{display:inline-block;width:1.5px;height:14px;background:var(--accent);vertical-align:-2px;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .send{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.12);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;cursor:pointer}
  .send.on{background:var(--accent);color:#1a1208}

  /* ===== diff (权限里的代码改动) ===== */
  .diff{background:rgba(0,0,0,.4);border-radius:8px;padding:6px 0;font-family:ui-monospace,monospace;font-size:10.5px;overflow:hidden}
  .dl{display:flex;gap:9px;padding:1px 11px}
  .dl .ln{color:rgba(255,255,255,.28);width:16px;text-align:right;flex:none}
  .dl .tx{white-space:pre;overflow:hidden;text-overflow:ellipsis}
  .dl.add{background:rgba(52,199,89,.16)}.dl.add .tx{color:#8be8a6}
  .dl.del{background:rgba(255,69,58,.16)}.dl.del .tx{color:#ff9d96}
  .dl.ctx .tx{color:rgba(255,255,255,.5)}
  .diffstat{font-size:9px;color:var(--t3);font-family:ui-monospace,monospace;margin-top:3px}

  /* ===== 自动弹出横幅(权限 / 提问) ===== */
  .banner{position:absolute;inset:0;padding:14px 16px;display:flex;flex-direction:column;cursor:pointer}
  .bhead{font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .bhead.perm{color:var(--orange)}.bhead.ask{color:var(--blue)}
  .bhead .bd{width:7px;height:7px;border-radius:50%;background:currentColor}
  .btool{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .btool .w{color:var(--orange)}.btool .f{color:var(--t2);font-family:ui-monospace,monospace;font-size:12px;font-weight:500}
  .bbody{flex:1;min-height:0;overflow:hidden;margin-top:8px}
  .bq{font-size:13px;font-weight:600;margin:6px 0 10px}
  .opt2{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--hair);margin-bottom:6px;cursor:pointer}
  .opt2:hover{background:rgba(255,255,255,.09)}
  .opt2 .num{color:var(--blue);font-weight:700}
  .opt2.sel{border-color:var(--accent);background:rgba(255,197,61,.12)}
  .bbtns{display:flex;gap:10px;margin-top:10px}
  .bbtn{flex:1;text-align:center;border-radius:10px;padding:10px;font-size:12px;font-weight:600;cursor:pointer}
  .bbtn.deny{background:rgba(255,255,255,.1);color:#fff}
  .bbtn.allow{background:var(--accent);color:#1a1208}
  .kbd{opacity:.55;font-size:10px;margin-left:5px;font-weight:500}
  .bviewdetail{font-size:9px;color:var(--t3);text-align:center;margin-top:6px}

  /* detail / settings */
  .sub{position:absolute;inset:0;padding:14px 16px;overflow:auto}
  .back{font-size:11px;color:var(--t2);font-weight:600;cursor:pointer;display:inline-flex;gap:4px;margin-bottom:10px}
  .dtitle{font-size:14px;font-weight:700}
  .dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
  .branch{font-size:10px;color:var(--t3);font-family:ui-monospace,monospace}
  .bdg{font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;color:#0a0a0a}
  .bdg.cl{background:var(--accent)}.bdg.tm{background:rgba(255,255,255,.12);color:var(--t2)}
  .jump{font-size:10px;color:var(--accent);font-weight:600;cursor:pointer;margin-left:auto}
  .sec{margin-top:12px}.sectitle{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--t3);margin-bottom:6px}
  .subr{display:flex;align-items:center;gap:7px;font-size:11px;margin-top:5px}
  .d6{width:6px;height:6px;border-radius:50%;flex:none}.d6.run{background:var(--cyan)}.d6.done{background:var(--green)}.d6.pend{border:1.5px solid var(--t3)}
  .subr .d{color:var(--t3);font-size:10px}.subr .e{margin-left:auto;font-size:9px;color:var(--t3)}
  .tk{display:flex;align-items:center;gap:7px;font-size:11px;margin-top:4px}.tk.done span:last-child{text-decoration:line-through;color:var(--t3)}
  .msg{font-size:11px;color:rgba(255,255,255,.62);line-height:1.45;background:rgba(255,255,255,.045);border-radius:8px;padding:8px 9px;margin-top:4px}
  .seth{font-size:13px;font-weight:700;margin-bottom:14px}
  .setrow{margin-bottom:16px}.setlbl{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .setdesc{font-size:10px;color:var(--t3);line-height:1.5;margin-bottom:8px}
  .toggle{font-size:11px;font-weight:600;border-radius:7px;padding:5px 13px;cursor:pointer;display:inline-block}
  .toggle.install{background:var(--accent);color:#1a1208}.toggle.remove{background:rgba(255,255,255,.1);color:#fff}
  .swatch{width:15px;height:15px;border-radius:50%;background:var(--accent);display:inline-block;vertical-align:-3px;margin-right:6px}
  .statusdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}

  .controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:18px;
    background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border:1px solid var(--hair);border-radius:14px;padding:12px 16px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:92vw}
  .cgrp{display:flex;flex-direction:column;gap:5px}
  .cgrp .cl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.4px}
  .cgrp .opts{display:flex;gap:5px}
  .opt{font-size:11px;color:var(--t2);background:rgba(255,255,255,.07);border-radius:7px;padding:4px 10px;cursor:pointer}
  .opt.on{background:var(--accent);color:#1a1208;font-weight:600}
</style>
</head>
<body>
<div class="desk">
  <div class="menubar"><span class="l"> Helm Notch Prototype</span><span>􀙇</span><span>100%</span><span>9:41</span></div>
  <div id="notch"><div id="bar"></div><div id="panel"></div></div>
  <div class="hint">移到刘海展开 2×2 · 点 session 看详情 · 点齿轮进设置 · 点速记打字<br>切到「等权限 / 提问」→ 横幅会<b style="color:#fff">自动从刘海跳出来</b></div>

  <div class="controls">
    <div class="cgrp"><span class="cl">本机 AGENT</span><div class="opts" id="ctl-mode">
      <span class="opt" data-mode="none">无</span><span class="opt on" data-mode="running">运行中</span>
      <span class="opt" data-mode="waiting">等权限</span><span class="opt" data-mode="asking">提问</span></div></div>
    <div class="cgrp"><span class="cl">HOOK</span><div class="opts" id="ctl-hook">
      <span class="opt on" data-hook="1">已装</span><span class="opt" data-hook="0">未装</span></div></div>
    <div class="cgrp"><span class="cl">媒体</span><div class="opts" id="ctl-play">
      <span class="opt on" data-play="1">播放</span><span class="opt" data-play="0">暂停</span><span class="opt" data-play="2">无</span></div></div>
  </div>
</div>

<script>
const palette=["#FB9E66","#FF6F61","#FFC53D","#B6E84F","#34D6C0","#4FD6E8","#5EA0FF","#7C9CFF","#B98CFF","#FF6FA5"];
const di=Math.floor(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/864e5);
document.documentElement.style.setProperty('--accent',palette[((di%10)+10)%10]);

const S={open:false,locked:false,view:'grid',detail:null,kind:'note',mode:'running',hook:true,play:1,captext:''};

const DIFF=[{n:12,k:'ctx',t:'const verify = (token) =>'},{n:13,k:'del',t:'  jwt.verify(token);'},
  {n:13,k:'add',t:"  if (!token) throw new"},{n:14,k:'add',t:"    AuthError('missing');"}];

const SESSIONS={
  running:[
    {id:'notch',folder:'notch',branch:'feat/notch-media-adapter',phase:'run',activity:'Running Bash',
     sub:[{t:'review-agent',d:'代码审查',e:'运行中 1m',s:'run'},{t:'test-agent',d:'跑测试',e:'完成',s:'done'}],
     tasks:[{t:'建库 schema',s:'done'},{t:'跑 migrations',s:'run'},{t:'填充种子数据',s:'pend'}],
     msg:'我把 NotchView 重构成 2×2 田字格,并接上 mediaremote-adapter 拿封面…'},
    {id:'app',folder:'app',branch:'main',phase:'run',activity:'Bash: swift build',sub:[],tasks:[],msg:''},
    {id:'helm',folder:'helm',branch:'main',phase:'done',activity:'',sub:[],tasks:[],msg:'已完成日历 API 接入。'}
  ],
  waiting:[
    {id:'notch',folder:'notch',branch:'feat/notch-media-adapter',phase:'wait',tool:'Edit',target:'src/auth/middleware.ts',diff:DIFF,sub:[],tasks:[],msg:''},
    {id:'app',folder:'app',branch:'main',phase:'run',activity:'Bash: npm test',sub:[],tasks:[],msg:''}
  ],
  asking:[
    {id:'notch',folder:'notch',branch:'feat/notch-media-adapter',phase:'ask',question:'用哪种鉴权方式接日历?',opts:['CalDAV(已接,推荐)','OAuth Google','先跳过'],sub:[],tasks:[],msg:''},
    {id:'helm',folder:'helm',branch:'main',phase:'run',activity:'Bash: pytest',sub:[],tasks:[],msg:''}
  ],
  none:[]
};
function sess(){return SESSIONS[S.mode];}
function pending(){return sess().find(s=>s.phase==='wait'||s.phase==='ask');}
function ph(){return {note:'随手记一笔…',journal:'今天发生了什么?',task:'到点让 agent 做什么…'}[S.kind];}

function renderBar(){
  const list=sess();const wait=list.filter(s=>s.phase==='wait'||s.phase==='ask').length;const run=list.filter(s=>s.phase==='run').length;
  let left;
  if(S.play===2) left=`<span class="cdot"></span><span style="font-size:10px;font-weight:600;color:var(--t2)">Helm</span>`;
  else if(S.play===1) left=`<span class="mart"></span><span class="eq"><i></i><i></i><i></i><i></i></span><span class="cnp">Snow Painting…</span>`;
  else left=`<span class="mart" style="opacity:.5"></span><span style="font-size:11px;color:var(--t3)">⏸</span>`;
  let right;
  if(wait>0) right=`<span class="bars wait"><i></i><i></i><i></i></span><span class="cct" style="color:var(--orange)">${wait}</span>`;
  else if(run>0) right=`<span class="cstar">✻</span><span class="cct">${run}</span>`;            // Claude loading
  else if(!S.hook) right=`<span style="font-size:11px;color:var(--accent)">✨</span>`;
  else right=`<span class="cev"><b>10:00</b> 站会</span>`;                                       // 没 session → 今日下一个日程

  document.getElementById('bar').innerHTML=`<div class="cleft">${left}</div><div class="ccam"><span class="lens"></span></div><div class="cright">${right}</div>`;
}

function renderPanel(){
  const p=document.getElementById('panel');
  if(S.view==='settings'){p.innerHTML=renderSettings();return;}
  if(S.view==='detail'){p.innerHTML=renderDetail();return;}
  if(S.view==='permission'){p.innerHTML=renderPermission();return;}
  if(S.view==='ask'){p.innerHTML=renderAsk();return;}
  p.innerHTML=`<div class="gear" data-act="settings">⚙</div><div class="quad">${cellMedia()}${cellCal()}${cellAgent()}${cellCapture()}</div>`;
}
function cellMedia(){
  if(S.play===2) return `<div class="cell tl"><div class="ch"><span>♪ 正在播放</span></div><div class="muted" style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:16px">♪</span>未在播放</div></div>`;
  return `<div class="cell tl"><div class="ch"><span>♪ 正在播放</span></div>
    <div style="display:flex;gap:10px"><div class="art"></div><div style="min-width:0;flex:1"><div class="title">Snow Painting the View</div><div class="artist">Brilliant Supervision</div></div></div>
    <div class="pbar"><i></i></div><div class="times"><span>0:31</span><span>4:02</span></div>
    <div class="tp"><span class="b">◀◀</span><span class="b big" data-act="play">${S.play===1?'⏸':'▶'}</span><span class="b">▶▶</span></div></div>`;
}
function cellCal(){
  const days=['日','一','二','三','四','五','六'];const today=new Date();const wd=today.getDay();let w='';
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()-wd+i);w+=`<div class="day${i===wd?' t':''}">${days[i]}<span class="n">${d.getDate()}</span></div>`;}
  return `<div class="cell tr"><div class="ch"><span>日历</span><span>${today.toLocaleString('en',{month:'short'}).toUpperCase()} ${today.getFullYear()}</span></div>
    <div class="week">${w}</div>
    <div class="ev"><div class="tk"></div><div><div class="et">站会</div><div class="es">10:00–10:30</div></div></div>
    <div class="ev"><div class="tk" style="background:var(--blue)"></div><div><div class="et">Final exam</div><div class="es">All-day</div></div></div></div>`;
}
function cellAgent(){
  const list=sess();const wait=list.filter(s=>s.phase==='wait'||s.phase==='ask');const active=list.filter(s=>s.phase!=='done').length;
  const head=`<div class="ch"><span${wait.length?' class="attn"':''}>◉ 本机 CLAUDE CODE</span>`+
    (wait.length?`<span class="attn">${wait.length} 待处理</span>`:`<span>${active} 活跃</span>`)+`</div>`;
  let body;
  if(list.length===0){
    body=!S.hook?`<div style="padding-top:10px"><div class="hookpill" data-act="settings"><span style="color:var(--accent)">✨</span><span class="tx">安装 Claude Code 监听 hook</span><span class="chev">设置 ›</span></div></div>`
      :`<div class="empty"><div class="bg">暂无运行中的 agent</div><div class="sm">开一个 Claude Code session 就会出现</div></div>`;
  } else {
    body=list.slice(0,3).map(rowHTML).join('');
  }
  return `<div class="cell bl">${head}${body}</div>`;
}
function rowHTML(s){
  const cls=s.phase==='run'?'run':(s.phase==='done'?'done':'wait');
  let mid;
  if(s.phase==='run'&&s.id==='notch') mid=`<span class="think"><span class="st">✻</span><span class="shine">正在思考…</span></span>`;
  else if(s.phase==='run') mid=`<span class="scmd">${s.activity||''}</span>`;
  else if(s.phase==='wait') mid=`<span class="scmd">${s.tool} ${s.target}</span>`;
  else if(s.phase==='ask') mid=`<span class="scmd">${s.question}</span>`;
  else mid=`<span class="scmd">${s.branch||''}</span>`;
  const tag=s.phase==='done'?'完成':s.phase==='wait'?'待批准':s.phase==='ask'?'待回答':'';
  const tagcls=(s.phase==='wait'||s.phase==='ask')?'stag w':'stag';
  return `<div class="srow" data-act="open" data-id="${s.id}"><span class="pdot ${cls}"></span><span class="snm">${s.folder}</span>${mid}<span class="${tagcls}">${tag}</span><span class="chev">›</span></div>`;
}
function cellCapture(){
  const chips=['note','journal','task'].map(k=>`<span class="chip${S.kind===k?' on':''}" data-act="kind" data-k="${k}">${({note:'速记',journal:'日记',task:'任务'})[k]}</span>`).join('');
  const fi=S.captext?S.captext+(S.locked?'<span class="caret"></span>':''):(S.locked?'<span class="caret"></span>':`<span class="ph">${ph()}</span>`);
  return `<div class="cell br"><div class="ch"><span>✎ 速记</span>${S.locked?'<span style="color:var(--accent);font-size:9px;font-weight:600">● 输入中</span>':''}</div>
    <div class="chips">${chips}</div><div class="capwrap"><div class="field${S.locked?' on':''}" data-act="focus">${fi}</div><div class="send${S.captext?' on':''}" data-act="send">↑</div></div></div>`;
}

/* ===== 自动弹出横幅 ===== */
function renderPermission(){
  const s=pending();if(!s)return '';
  const diff=s.diff.map(d=>`<div class="dl ${d.k}"><span class="ln">${d.n}</span><span class="tx">${d.k==='add'?'+':d.k==='del'?'-':' '}${d.t}</span></div>`).join('');
  return `<div class="banner" data-act="open" data-id="${s.id}">
    <div class="bhead perm"><span class="bd"></span>Permission Request · ${s.folder}</div>
    <div class="btool"><span class="w">⚠ ${s.tool}</span><span class="f">${s.target}</span></div>
    <div class="bbody"><div class="diff">${diff}</div><div class="diffstat">+3 −1 · 点卡片看完整详情</div></div>
    <div class="bbtns"><span class="bbtn deny" data-act="resolve">Deny<span class="kbd">⌘N</span></span><span class="bbtn allow" data-act="resolve">Allow<span class="kbd">⌘Y</span></span></div>
  </div>`;
}
function renderAsk(){
  const s=pending();if(!s)return '';
  const opts=s.opts.map((o,i)=>`<div class="opt2${i===0?' sel':''}" data-act="resolve"><span class="num">${i+1}</span>${o}</div>`).join('');
  return `<div class="banner" data-act="open" data-id="${s.id}">
    <div class="bhead ask"><span class="bd"></span>Claude 在问 · ${s.folder}</div>
    <div class="bq">${s.question}</div>
    <div class="bbody">${opts}<div class="capwrap" style="margin-top:8px"><div class="field" data-act="resolve">或直接输入回答…</div><div class="send">↑</div></div></div>
  </div>`;
}

function renderDetail(){
  const s=sess().find(x=>x.id===S.detail)||sess()[0];if(!s)return '';
  let secs='';
  if(s.phase==='wait'){
    const diff=s.diff.map(d=>`<div class="dl ${d.k}"><span class="ln">${d.n}</span><span class="tx">${d.k==='add'?'+':d.k==='del'?'-':' '}${d.t}</span></div>`).join('');
    secs=`<div class="sec"><div class="sectitle">⚠ 请求 ${s.tool} · ${s.target}</div><div class="diff">${diff}</div>
      <div class="bbtns" style="margin-top:10px"><span class="bbtn deny" data-act="resolve">Deny<span class="kbd">⌘N</span></span><span class="bbtn allow" data-act="resolve">Allow<span class="kbd">⌘Y</span></span></div></div>`;
  } else if(s.phase==='ask'){
    const opts=s.opts.map((o,i)=>`<div class="opt2${i===0?' sel':''}" data-act="resolve"><span class="num">${i+1}</span>${o}</div>`).join('');
    secs=`<div class="sec"><div class="sectitle">Claude 在问</div><div class="bq" style="font-size:12px">${s.question}</div>${opts}</div>`;
  } else {
    if(s.phase==='run') secs+=`<div class="sec"><span class="think"><span class="st">✻</span><span class="shine">正在思考 · ${s.activity}</span></span></div>`;
    if(s.sub&&s.sub.length) secs+=`<div class="sec"><div class="sectitle">↳ 子 AGENT (${s.sub.length})</div>`+s.sub.map(x=>`<div class="subr"><span class="d6 ${x.s}"></span><span style="color:rgba(255,255,255,.85)">${x.t}</span><span class="d">${x.d}</span><span class="e">${x.e}</span></div>`).join('')+`</div>`;
    if(s.tasks&&s.tasks.length){const dn=s.tasks.filter(t=>t.s==='done').length,rn=s.tasks.filter(t=>t.s==='run').length;
      secs+=`<div class="sec"><div class="sectitle">任务 · ${dn} 完成 / ${rn} 进行 / ${s.tasks.length-dn-rn} 待办</div>`+s.tasks.map(t=>`<div class="tk ${t.s==='done'?'done':''}"><span class="d6 ${t.s==='run'?'run':t.s==='done'?'done':'pend'}"></span><span>${t.t}</span></div>`).join('')+`</div>`;}
    if(s.msg) secs+=`<div class="sec"><div class="sectitle">最近</div><div class="msg">${s.msg}</div></div>`;
  }
  const attn=(s.phase==='wait'||s.phase==='ask');
  return `<div class="sub"><div class="back" data-act="back">‹ 返回 · 本机 CLAUDE CODE</div>
    <div class="dtitle"${attn?' style="color:#ffd9a3"':''}>${s.folder}${s.phase==='wait'?' · 请求权限':s.phase==='ask'?' · 提问':''}</div>
    <div class="dmeta"><span class="branch">${s.branch}</span><span class="bdg cl">claude</span><span class="bdg tm">iTerm2</span><span class="branch">· 2m</span><span class="jump">↗ 跳到终端</span></div>${secs}</div>`;
}
function renderSettings(){
  const h=S.hook;
  return `<div class="sub"><div class="back" data-act="back">‹ 返回</div><div class="seth">Helm Notch 设置</div>
    <div class="setrow"><div class="setlbl">⊙ 本机 Claude Code 监听</div>
      <div class="setdesc">在 ~/.claude/settings.json 安装 hook,刘海即可显示本机 Claude Code 状态并允许/拒绝。安装前自动备份。</div>
      <div><span class="statusdot" style="background:${h?'var(--green)':'var(--t3)'}"></span><span style="font-size:11px;color:var(--t2)">${h?'已安装':'未安装'}</span>&nbsp;&nbsp;<span class="toggle ${h?'remove':'install'}" data-act="togglehook">${h?'卸载':'安装 hook'}</span></div></div>
    <div class="setrow"><div class="setlbl">⊙ 强调色</div><div style="font-size:11px;color:var(--t2);margin-bottom:6px"><span class="swatch"></span>每天自动轮换 · 今日色</div>
      <div class="setdesc">折叠条保持黑底,只有强调色随当日色走,午夜自动切换。无需设置。</div></div></div>`;
}

function notchClass(){
  const n=document.getElementById('notch');
  n.classList.toggle('open',S.open&&S.view!=='permission'&&S.view!=='ask');
  n.classList.toggle('banner',S.open&&(S.view==='permission'||S.view==='ask'));
  n.style.setProperty('--bh',S.view==='ask'?'230px':'250px');
}
function render(){notchClass();renderBar();renderPanel();syncControls();}
function syncControls(){
  document.querySelectorAll('#ctl-mode .opt').forEach(o=>o.classList.toggle('on',o.dataset.mode===S.mode));
  document.querySelectorAll('#ctl-hook .opt').forEach(o=>o.classList.toggle('on',o.dataset.hook==(S.hook?'1':'0')));
  document.querySelectorAll('#ctl-play .opt').forEach(o=>o.classList.toggle('on',o.dataset.play==String(S.play)));
}

const notch=document.getElementById('notch');
notch.addEventListener('mouseenter',()=>{ if(S.view==='permission'||S.view==='ask')return; S.open=true;render(); });
notch.addEventListener('mouseleave',()=>{ if(S.locked||S.view!=='grid')return; S.open=false;render(); });
notch.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;e.stopPropagation();const act=el.dataset.act;
  if(act==='settings'){S.open=true;S.view='settings';}
  else if(act==='back'){ S.view=pending()?(pending().phase==='ask'?'ask':'permission'):'grid'; if(S.view!=='grid'){/* stay banner */} }
  else if(act==='open'){S.open=true;S.view='detail';S.detail=el.dataset.id;}
  else if(act==='kind'){S.kind=el.dataset.k;}
  else if(act==='focus'){S.locked=true;}
  else if(act==='send'){S.captext='';S.locked=false;}
  else if(act==='play'){S.play=S.play===1?0:1;}
  else if(act==='resolve'){S.mode='running';S.view='grid';}
  else if(act==='togglehook'){S.hook=!S.hook;}
  render();
});
document.querySelector('.desk').addEventListener('click',e=>{ if(!notch.contains(e.target)&&!e.target.closest('.controls')){ if(S.view==='permission'||S.view==='ask')return; S.locked=false;S.open=false;S.view='grid';render(); }});
document.addEventListener('keydown',e=>{
  if(S.view==='permission'){ if(e.key==='y'||e.key==='Y'){S.mode='running';S.view='grid';render();} if(e.key==='n'||e.key==='N'){S.mode='running';S.view='grid';render();} return; }
  if(!S.locked)return;
  if(e.key==='Escape'||e.key==='Enter'){S.captext='';S.locked=false;render();return;}
  if(e.key==='Backspace'){S.captext=S.captext.slice(0,-1);render();e.preventDefault();return;}
  if(e.key.length===1){S.captext+=e.key;render();}
});
function setMode(m){ S.mode=m;
  if(m==='waiting'){S.open=true;S.view='permission';}
  else if(m==='asking'){S.open=true;S.view='ask';}
  else {S.view='grid';}
  render();
}
document.querySelectorAll('#ctl-mode .opt').forEach(o=>o.onclick=()=>setMode(o.dataset.mode));
document.querySelectorAll('#ctl-hook .opt').forEach(o=>o.onclick=()=>{S.hook=o.dataset.hook==='1';render();});
document.querySelectorAll('#ctl-play .opt').forEach(o=>o.onclick=()=>{S.play=+o.dataset.play;render();});
render();
</script>
</body>
</html>
